<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEF LS50W (Volume)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0c0c0e;--surface:#141417;--border:#2a2a30;--accent:#5b82e0;--accent-rgb:91,130,224;
    --text:#e8e4dc;--muted:#82838f;--red:#c0392b;--green:#2ecc71;--danger-zone:#7a2e3d;
    --safe-pct:45%; /* must match SAFE_MAX in the script below */
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;
    min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;overflow:hidden}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(
    0deg,transparent,transparent 2px,rgba(255,255,255,0.012) 2px,rgba(255,255,255,0.012) 4px);
    pointer-events:none;z-index:0}
  /* ambient glow behind the card, tinted from --accent-rgb so it re-tints live with the accent
     picker (see setAccent()) instead of staying blue - fills the dead space around a small
     centered card with something that reads as deliberate ("a component glowing in a dark room")
     rather than empty chrome */
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 640px 520px at 50% 50%,rgba(var(--accent-rgb),0.14),
    transparent 70%)}
  /* max-height + overflow-y matter on short viewports (landscape phones, small windows) - body's
     own overflow:hidden means anything taller than the viewport would otherwise just clip past
     the card's fixed padding with no way to reach it, rather than scrolling into view. */
  .card{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;width:min(420px,92vw);padding:48px 44px 40px;
    max-height:100vh;max-height:100dvh;overflow-y:auto}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:0.35em;
    color:var(--muted);margin-bottom:6px}
  .model{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:0.08em;
    color:var(--text);line-height:1;margin-bottom:35px}
  .model span{color:var(--accent)}
  /* margin-bottom is larger than .model's to counteract Bebas Neue's own metrics: at this
     font-size the "32" glyph's ink sits ~13px closer to the top of its line box than the
     bottom (nearly no descender), so without this offset the number reads as sitting low
     between the title and the slider even though the boxes around it are evenly spaced. */
  .vol-wrap{display:flex;align-items:baseline;gap:10px;margin-bottom:22px}
  .vol-number{font-family:'Bebas Neue',sans-serif;font-size:clamp(80px,22vw,120px);
    line-height:1;color:var(--accent);letter-spacing:-0.02em;transition:color 0.3s}
  .vol-number.muted{color:var(--muted)}
  .vol-number.stale{opacity:0.4}
  .vol-unit{font-size:13px;color:var(--muted);letter-spacing:0.15em;padding-bottom:14px}
  .slider-wrap{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .vol-btn{background:none;border:1px solid var(--border);color:var(--muted);
    font-family:'DM Mono',monospace;font-size:18px;width:36px;height:36px;
    cursor:pointer;border-radius:4px;transition:border-color 0.2s,color 0.2s;
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .vol-btn:hover{border-color:var(--accent);color:var(--accent)}
  .vol-btn:active{background:var(--border)}
  .vol-btn:disabled,input[type=range]:disabled,.safety-toggle input[type=checkbox]:disabled{
    opacity:0.35;cursor:not-allowed}
  .vol-btn:disabled{border-color:var(--border);color:var(--muted)}
  .vol-btn:focus-visible,.refresh-btn:focus-visible,.settings-btn:focus-visible,
  .safety-toggle input[type=checkbox]:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}
  .slider-track{position:relative;flex:1;height:8px;border-radius:4px;overflow:visible;
    background:linear-gradient(to right,var(--border) 0%,var(--border) var(--safe-pct),var(--danger-zone) var(--safe-pct),var(--danger-zone) 100%)}
  input[type=range]{-webkit-appearance:none;appearance:none;position:absolute;left:0;top:0;
    height:8px;width:var(--safe-pct);outline:none;cursor:pointer;border-radius:4px;
    background:transparent;transition:opacity 0.3s}
  input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  /* was a hardcoded rgba(91,130,224,...) - now derived from --accent-rgb so the thumb's glassy
     tint follows whatever accent color is picked, instead of staying blue forever */
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;box-sizing:border-box;
    width:24px;height:24px;border-radius:50%;background:rgba(var(--accent-rgb),0.28);cursor:pointer;
    backdrop-filter:blur(6px) saturate(160%) brightness(225%);-webkit-backdrop-filter:blur(6px) saturate(160%) brightness(225%);
    border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border);transition:transform 0.15s}
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
  input[type=range]::-moz-range-thumb{box-sizing:border-box;width:24px;height:24px;border-radius:50%;
    background:rgba(var(--accent-rgb),0.28);cursor:pointer;
    backdrop-filter:blur(6px) saturate(160%) brightness(225%);-webkit-backdrop-filter:blur(6px) saturate(160%) brightness(225%);
    border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
  input[type=range]::-moz-range-track{background:transparent}
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;
    letter-spacing:0.12em;color:var(--muted);border-top:1px solid var(--border);padding-top:20px}
  .meta-right{display:flex;align-items:center;gap:10px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);
    margin-right:8px;transition:background 0.3s}
  .dot.online{background:var(--green);box-shadow:0 0 6px var(--green)}
  .dot.offline{background:var(--red);box-shadow:0 0 6px var(--red)}
  .dot.loading{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .mute-badge{display:none;font-size:10px;letter-spacing:0.18em;background:var(--border);
    color:var(--muted);padding:3px 8px;border-radius:2px}
  .mute-badge.visible{display:inline-block}
  .refresh-btn{background:none;border:1px solid var(--border);color:var(--muted);
    font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.15em;padding:5px 12px;
    cursor:pointer;border-radius:4px;transition:border-color 0.2s,color 0.2s}
  .refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
  .settings-btn{background:none;border:1px solid var(--border);color:var(--muted);
    width:26px;height:26px;border-radius:50%;font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:border-color 0.2s,color 0.2s}
  .settings-btn:hover{border-color:var(--accent);color:var(--accent)}
  /* svg is inline by default and carries a few px of baseline gap even inside a flex-centered
     parent - block display removes that so the icon actually lands in the button's true center */
  .settings-btn svg{display:block}
  /* position:fixed + centered, not anchored to the gear button - a popover anchored to the
     card can render fully off-screen on short viewports (landscape phones, small windows)
     with no way to scroll to it. Centering in the viewport guarantees it's always reachable
     regardless of screen size or orientation. */
  .settings-panel{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,0.55);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .settings-panel[hidden]{display:none}
  /* equal padding on all 4 sides, and a width that's EXACTLY content-width + padding (206px of
     circles: 6 x 26px swatches + 5 x 10px gaps, plus 22px on each side) - not just "wide enough".
     Sizing it any wider would leave slack after the last swatch that the hex field's flex:1
     would then stretch into, pushing its right edge past the swatch row's. */
  .settings-box{background:var(--surface);border:1px solid var(--border);border-radius:6px;
    padding:22px;width:min(250px,100%);max-height:80vh;overflow-y:auto;
    box-shadow:0 8px 24px rgba(0,0,0,0.4)}
  .panel-label{display:block;font-size:10px;letter-spacing:0.12em;color:var(--muted);margin-bottom:12px}
  .swatch-group{display:flex;gap:10px}
  .swatch{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;padding:0;
    box-shadow:0 0 0 2px transparent;transition:box-shadow 0.15s}
  .swatch:hover{box-shadow:0 0 0 2px var(--border)}
  .swatch.active{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}
  /* second row: the custom-color swatch/picker plus a hex text field, side by side */
  .custom-row{display:flex;align-items:center;gap:12px;margin-top:16px}
  /* flex-start, not center - the "CUSTOM" caption below is wider than the 26px circle, and
     center-aligning against it would shift the circle itself right of the row's left edge,
     throwing off its alignment with the leftmost preset swatch above */
  .custom-swatch-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:5px;flex-shrink:0}
  .custom-swatch-box{position:relative;width:26px;height:26px}
  /* the VISIBLE circle - a plain div, not the native color input. Mobile browsers routinely give
     input[type=color] its own touch-target chrome (minimum size, platform swatch rendering) that
     ignores author CSS entirely, so matching the preset swatches' exact 26px size can't be trusted
     to the native control - only to an element we fully control ourselves. No border (a solid
     inset border would eat into the visible circle and make its color patch read as smaller than
     the presets', even at an identical 26px footprint) - the pencil icon + "CUSTOM" caption below
     are what mark this one as different, same as the presets' fill-edge-to-edge look otherwise. */
  .custom-swatch-fill{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;
    box-shadow:0 0 0 2px transparent;transition:box-shadow 0.15s;pointer-events:none}
  .custom-swatch-box:hover .custom-swatch-fill{box-shadow:0 0 0 2px var(--border)}
  .custom-swatch-fill.active{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}
  /* text-shadow instead of mix-blend-mode - stays legible against literally any picked fill
     color without depending on blend-mode support inside a color-swatch's own rendering layer */
  .custom-swatch-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none}
  /* the actual native control - fully transparent and stretched over the box so it stays tappable/
     clickable (opening the real OS picker) without ever being visually responsible for the circle's
     size or appearance, whatever native chrome a given browser/platform tries to draw around it */
  .custom-swatch-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;
    border:none;padding:0}
  .custom-swatch-label{font-size:8px;letter-spacing:0.1em;color:var(--muted)}
  /* the fallback path for hardware/browsers whose native color picker has no way to type a hex
     value at all (e.g. Firefox Android just opens a fixed swatch grid) - always visible, not
     hidden behind detecting that case, so it works identically everywhere */
  .hex-input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);
    color:var(--text);font-family:'DM Mono',monospace;font-size:13px;letter-spacing:0.03em;
    padding:8px 10px;border-radius:4px}
  .hex-input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hex-input.invalid{border-color:var(--red);color:var(--red)}
  .safety-toggle{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:0.1em;
    color:var(--muted);margin-bottom:24px;cursor:pointer;user-select:none}
  .safety-toggle:has(input:disabled){cursor:not-allowed}
  .safety-toggle input[type=checkbox]{-webkit-appearance:none;appearance:none;position:relative;
    flex-shrink:0;width:14px;height:14px;border:1px solid var(--border);border-radius:3px;
    background:var(--bg);cursor:pointer;transition:border-color 0.2s,background 0.2s}
  .safety-toggle:hover input[type=checkbox]{border-color:var(--accent)}
  .safety-toggle input[type=checkbox]:disabled{border-color:var(--border)}
  .safety-toggle input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
  .safety-toggle input[type=checkbox]:checked::after{content:'';position:absolute;
    left:4px;top:1px;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;
    transform:rotate(45deg)}
  .last-updated{font-size:10px;color:var(--muted);margin-top:14px;letter-spacing:0.08em;min-height:14px}
  .error-msg{display:none;margin-top:20px;padding:12px 16px;border:1px solid #3a1a1a;
    background:#1e0d0d;color:#e07070;font-size:11px;line-height:1.6;border-radius:4px}
  .error-msg.visible{display:block}
</style>
</head>
<body>
<div class="card">
  <div class="brand">KEF SPEAKERS</div>
  <div class="model">LS50 <span>Wireless</span></div>
  <div class="vol-wrap">
    <div class="vol-number" id="volNum">--</div>
    <div class="vol-unit">VOL</div>
  </div>
  <div class="slider-wrap">
    <button class="vol-btn" id="btnDown" onclick="stepVolume(-1)" disabled aria-label="Decrease volume">−</button>
    <div class="slider-track" id="sliderTrack">
      <input type="range" id="slider" min="0" max="45" value="0" disabled
        aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0%">
    </div>
    <button class="vol-btn" id="btnUp" onclick="stepVolume(+1)" disabled aria-label="Increase volume">+</button>
  </div>
  <label class="safety-toggle" for="unlockCheckbox">
    <input type="checkbox" id="unlockCheckbox" disabled>
    <span>UNLOCK FULL RANGE (UP TO 100)</span>
  </label>
  <div class="meta">
    <div><span class="dot loading" id="dot"></span><span id="statusText">CONNECTING…</span></div>
    <div class="meta-right">
      <span class="mute-badge" id="muteBadge">MUTED</span>
      <button class="refresh-btn" onclick="fetchVolume()">↺ REFRESH</button>
      <button class="settings-btn" id="settingsBtn" aria-label="Settings">
        <!-- thin stroke outline, matching the visual weight of every other icon/border in this
             UI (kef_display's rotate/fullscreen icons, the 1px card borders) - a solid filled gear
             read as noticeably "heavier" than everything else on the page, even once its
             proportions were tuned. Path traces both edges of each of the 8 teeth (computed, not
             hand-fit) plus the root fillet between them, so the outline itself is what reads as a
             gear - no filled mass needed to make the shape legible. -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M 18.82 10.43 L 21.19 10.55 L 21.19 13.45 L 18.82 13.57 A 7 7 0 0 1 17.94 15.71 L 19.52 17.47 L 17.47 19.52 L 15.71 17.94 A 7 7 0 0 1 13.57 18.82 L 13.45 21.19 L 10.55 21.19 L 10.43 18.82 A 7 7 0 0 1 8.29 17.94 L 6.53 19.52 L 4.48 17.47 L 6.06 15.71 A 7 7 0 0 1 5.18 13.57 L 2.81 13.45 L 2.81 10.55 L 5.18 10.43 A 7 7 0 0 1 6.06 8.29 L 4.48 6.53 L 6.53 4.48 L 8.29 6.06 A 7 7 0 0 1 10.43 5.18 L 10.55 2.81 L 13.45 2.81 L 13.57 5.18 A 7 7 0 0 1 15.71 6.06 L 17.47 4.48 L 19.52 6.53 L 17.94 8.29 A 7 7 0 0 1 18.82 10.43 Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="settings-panel" id="settingsPanel" hidden>
    <div class="settings-box">
      <span class="panel-label">ACCENT COLOR</span>
      <div class="swatch-group" id="swatchGroup">
        <button class="swatch" data-hex="#5b82e0" style="background:#5b82e0" aria-label="Blue accent"></button>
        <button class="swatch" data-hex="#4fc3a1" style="background:#4fc3a1" aria-label="Teal accent"></button>
        <button class="swatch" data-hex="#9b6bdb" style="background:#9b6bdb" aria-label="Purple accent"></button>
        <button class="swatch" data-hex="#e0a75b" style="background:#e0a75b" aria-label="Amber accent"></button>
        <button class="swatch" data-hex="#e05b6e" style="background:#e05b6e" aria-label="Coral accent"></button>
        <button class="swatch" data-hex="#4fb86a" style="background:#4fb86a" aria-label="Green accent"></button>
      </div>
      <div class="custom-row">
        <div class="custom-swatch-wrap">
          <div class="custom-swatch-box">
            <div class="custom-swatch-fill" id="customSwatchFill"></div>
            <span class="custom-swatch-icon" aria-hidden="true">&#9998;</span>
            <input type="color" class="custom-swatch-input" id="customColor" value="#5b82e0"
              aria-label="Custom accent color" title="Custom color">
          </div>
          <span class="custom-swatch-label">CUSTOM</span>
        </div>
        <!-- Firefox Android's native color picker opens a fixed swatch grid with no way to type
             an arbitrary hex value, so this text field is the only truly custom-color path there -->
        <input type="text" class="hex-input" id="hexInput" value="#5b82e0" maxlength="7"
          aria-label="Accent color hex code" spellcheck="false" autocapitalize="off" autocomplete="off">
      </div>
    </div>
  </div>
  <div class="last-updated" id="lastUpdated"></div>
  <div class="error-msg" id="errorMsg" role="alert"></div>
</div>
<script>
  // Page is served by the same Flask app it talks to, so relative paths
  // work regardless of hostname/IP - no need to hardcode the server address.
  const AUTO_REFRESH_MS = 750;

  const volNum=document.getElementById("volNum");
  const dot=document.getElementById("dot");
  const statusTxt=document.getElementById("statusText");
  const muteBadge=document.getElementById("muteBadge");
  const lastUpd=document.getElementById("lastUpdated");
  const errorMsg=document.getElementById("errorMsg");
  const slider=document.getElementById("slider");
  const sliderTrack=document.getElementById("sliderTrack");
  const btnDown=document.getElementById("btnDown");
  const btnUp=document.getElementById("btnUp");
  const unlockCheckbox=document.getElementById("unlockCheckbox");
  const settingsBtn=document.getElementById("settingsBtn");
  const settingsPanel=document.getElementById("settingsPanel");

  const SAFE_MAX=45;
  const FULL_MAX=100;
  const THUMB_PX=24; // must match the thumb width/height in CSS
  let maxVol=SAFE_MAX;

  let dragging=false;
  let isOnline=false;
  let committing=false; // true from the moment an edit starts until it's fully resolved - blocks polling from clobbering the display mid-edit
  let sendQueue=Promise.resolve(); // serializes set-volume requests so rapid edits never open overlapping TCP connections to the speaker

  function applyMaxVol(){
    // slider.max and slider.width move together so a given value always sits at the same
    // pixel position on the track regardless of lock state - the browser physically can't
    // drag the thumb past the boundary, instead of just snapping back after release.
    // Native range inputs inset the thumb's travel by half its own width on each edge, so a
    // plain percentage of the track width doesn't land in the same place across different
    // box widths - THUMB_PX has to be factored into the math, using the track's real pixel size.
    slider.max=maxVol;
    const trackW=sliderTrack.clientWidth;
    slider.style.width=(THUMB_PX+(maxVol/FULL_MAX)*(trackW-THUMB_PX))+"px";
  }
  applyMaxVol();
  window.addEventListener("resize",applyMaxVol);

  unlockCheckbox.addEventListener("change",()=>{
    maxVol=unlockCheckbox.checked?FULL_MAX:SAFE_MAX;
    applyMaxVol();
    const current=parseInt(volNum.textContent)||0;
    if(!unlockCheckbox.checked && current>SAFE_MAX){
      clearTimeout(stepTimer);
      stepPending=null;
      updateUI(SAFE_MAX,volNum.classList.contains("muted")); // match the display to the newly-shrunk track immediately, don't wait for the queued commit to resolve (it may never send, e.g. if offline)
      queueSetVolume(SAFE_MAX);
    } else {
      updateUI(current,volNum.classList.contains("muted")); // refresh the fill gradient against the new maxVol immediately, don't wait for the next poll
    }
  });

  slider.addEventListener("mousedown",()=>{dragging=true;committing=true;});
  slider.addEventListener("touchstart",()=>{dragging=true;committing=true;});
  // input fires for drag AND keyboard arrow presses alike - always safe to live-update here,
  // since it only ever comes from genuine user interaction, never from our own updateUI() calls
  // (programmatic .value assignment doesn't trigger input/change).
  slider.addEventListener("input",()=>{
    updateUI(parseInt(slider.value),volNum.classList.contains("muted"));
  });
  // change fires once per discrete keyboard step, and once on drag release - both funnel into
  // scheduleCommit (shared with the +/- buttons below), which is idempotent for a repeated same
  // value. That sidesteps needing to know whether this or the window mouseup/touchend below fires
  // first for a drag release - whichever runs first "wins" and the other is a harmless no-op.
  slider.addEventListener("change",()=>{
    scheduleCommit(parseInt(slider.value));
  });
  // mouseup/touchend/touchcancel are bound on window, not the slider itself - a drag can easily end
  // with the pointer off the (thin) track, and a slider-scoped listener would then never fire,
  // leaving `dragging` stuck true forever and the thumb permanently frozen against updates.
  // touchcancel (the OS interrupting a touch gesture mid-drag) must be handled the same way touchend
  // is, or the same stuck-forever bug reappears via a path that never fires touchend at all.
  window.addEventListener("mouseup",()=>{if(dragging){dragging=false;scheduleCommit(parseInt(slider.value));}});
  window.addEventListener("touchend",()=>{if(dragging){dragging=false;scheduleCommit(parseInt(slider.value));}});
  window.addEventListener("touchcancel",()=>{if(dragging){dragging=false;scheduleCommit(parseInt(slider.value));}});

  function setOnline(online){
    isOnline=online;
    dot.className="dot "+(online?"online":"offline");
    statusTxt.textContent=online?"ONLINE":"OFFLINE";
    slider.disabled=!online;
    btnDown.disabled=!online;
    btnUp.disabled=!online;
    unlockCheckbox.disabled=!online;
  }

  function sliderGradient(vol100,muted){
    // The danger-zone backdrop is drawn once by .slider-track's own static background and never
    // moves. The fill just needs to (a) go transparent past the current value, so that backdrop
    // shows through unchanged ahead of the thumb, and (b) switch from blue to red once the fill
    // itself has crossed SAFE_MAX, so already-filled track reflects "you're in the danger zone"
    // instead of staying blue right up to the thumb.
    const v=Math.max(0,Math.min(maxVol,vol100));
    const boxWidth=slider.offsetWidth;
    // Same inset-corrected mapping the native thumb uses (see applyMaxVol) - maxVol cancels out
    // of this formula, which is why a given value always lands at the same pixel position on the
    // track regardless of lock state. Reusing it for SAFE_MAX below keeps the color switch-point
    // exactly aligned with the static backdrop's boundary instead of drifting near the edges.
    const toPct=val=>(maxVol>0&&boxWidth>THUMB_PX)?((THUMB_PX/2+(val/maxVol)*(boxWidth-THUMB_PX))/boxWidth*100):0;
    const pct=toPct(v);
    const safePct=Math.min(pct,toPct(Math.min(SAFE_MAX,maxVol)));
    const safeColor=muted?"var(--muted)":"var(--accent)";
    const dangerColor=muted?"var(--muted)":"var(--red)";
    return `linear-gradient(to right,${safeColor} 0%,${safeColor} ${safePct}%,`+
      `${dangerColor} ${safePct}%,${dangerColor} ${pct}%,transparent ${pct}%,transparent 100%)`;
  }

  function updateUI(vol100,muted,stale=false){
    volNum.textContent=vol100;
    if(!dragging) slider.value=vol100;
    slider.style.background=sliderGradient(vol100,muted);
    // aria-value* stay pinned to the true 0-100 scale regardless of the native min/max, which
    // get resized by applyMaxVol() for drag-blocking - without this a screen reader would announce
    // e.g. "32, maximum 45" instead of the real 32%.
    slider.setAttribute("aria-valuenow",vol100);
    slider.setAttribute("aria-valuetext",vol100+(muted?"% (muted)":"%"));
    volNum.classList.toggle("stale",stale);
    if(muted){
      volNum.classList.add("muted");
      muteBadge.classList.add("visible");
    } else {
      volNum.classList.remove("muted");
      muteBadge.classList.remove("visible");
    }
  }

  async function fetchVolume(force=false){
    try{
      const res=await fetch(`/volume`,{signal:AbortSignal.timeout(15000)});
      const data=await res.json();
      if(!data.online){
        setOnline(false);
        if(force||!committing) updateUI(Math.round(data.volume*100),data.muted,true);
        errorMsg.textContent="Speakers offline, showing last known volume. "+(data.error||"");
        errorMsg.classList.add("visible");
        return;
      }
      setOnline(true);
      errorMsg.classList.remove("visible");
      if(force||!committing) updateUI(Math.round(data.volume*100),data.muted,false);
      lastUpd.textContent="Last updated: "+new Date().toLocaleTimeString();
    } catch(err){
      setOnline(false);
      errorMsg.textContent="Cannot reach server. ("+err.message+")";
      errorMsg.classList.add("visible");
    }
  }

  async function setVolume(vol){
    // committing is reset exactly once, here, regardless of which branch below is taken -
    // no other line in this function may set it back to false.
    try{
      if(!isOnline){
        errorMsg.textContent="Speaker went offline, change not sent.";
        errorMsg.classList.add("visible");
        await fetchVolume(true);
        return;
      }
      vol=Math.max(0,Math.min(maxVol,vol));
      committing=true;
      updateUI(vol,volNum.classList.contains("muted"));
      const res=await fetch(`/volume/set`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({volume:vol}),
        signal:AbortSignal.timeout(15000)
      });
      const data=await res.json();
      if(!data.ok){
        errorMsg.textContent="Failed to set volume. "+(data.error||"");
        errorMsg.classList.add("visible");
        await fetchVolume(true);
      }
    } catch(err){
      errorMsg.textContent="Failed to set volume. ("+err.message+")";
      errorMsg.classList.add("visible");
      await fetchVolume(true);
    } finally {
      committing=false;
    }
  }

  function queueSetVolume(vol){
    sendQueue=sendQueue.then(()=>setVolume(vol),()=>setVolume(vol));
    return sendQueue;
  }

  const STEP_DEBOUNCE_MS=250;
  let stepTimer=null;
  let stepPending=null;

  // Shared by the +/- buttons, keyboard arrow presses, and slider drag release: debounces rapid
  // repeated commits (e.g. holding an arrow key, or clicking + quickly) into a single trailing
  // request, so the speaker's fragile control port never sees a flood of near-simultaneous connects.
  function scheduleCommit(vol){
    stepPending=vol;
    committing=true;
    clearTimeout(stepTimer);
    stepTimer=setTimeout(()=>{
      const v=stepPending;
      stepPending=null;
      queueSetVolume(v);
    },STEP_DEBOUNCE_MS);
  }

  function stepVolume(delta){
    if(!isOnline) return;
    const base=stepPending!==null?stepPending:(parseInt(volNum.textContent)||0);
    const next=Math.max(0,Math.min(maxVol,base+delta));
    updateUI(next,volNum.classList.contains("muted"));
    scheduleCommit(next);
  }

  // Arrow keys work anywhere on the page, not just while the slider has focus - if the slider
  // IS focused, its own native keyboard handling (wired above) already covers this, so bail out
  // here to avoid double-stepping the same keypress.
  document.addEventListener("keydown",(e)=>{
    if(document.activeElement===slider) return;
    if(e.key==="ArrowRight"||e.key==="ArrowUp"){
      e.preventDefault();
      stepVolume(1);
    } else if(e.key==="ArrowLeft"||e.key==="ArrowDown"){
      e.preventDefault();
      stepVolume(-1);
    }
  });

  // --- settings panel / accent color ---
  const ACCENT_KEY="kef_volume_accent";
  const ACCENT_PRESETS=["#5b82e0","#4fc3a1","#9b6bdb","#e0a75b","#e05b6e","#4fb86a"];
  const HEX_RE=/^#[0-9a-f]{6}$/i;
  const customColorInput=document.getElementById("customColor");
  const customSwatchFill=document.getElementById("customSwatchFill");
  const hexInput=document.getElementById("hexInput");
  let currentAccent=ACCENT_PRESETS[0];

  function hexToRgb(hex){
    const n=parseInt(hex.slice(1),16);
    return `${(n>>16)&255},${(n>>8)&255},${n&255}`;
  }
  // Accepts "#rgb" shorthand or a bare "rgb"/"rrggbb" (no leading #) too, since that's the
  // natural thing to type into a plain text field - only setAccent's caller needs to deal with
  // the strict 6-digit form.
  function normalizeHex(raw){
    let v=raw.trim().toLowerCase();
    if(!v.startsWith("#")) v="#"+v;
    if(/^#[0-9a-f]{3}$/.test(v)) v="#"+v.slice(1).split("").map(c=>c+c).join("");
    return v;
  }
  function setAccent(hex){
    hex=hex.toLowerCase();
    currentAccent=hex;
    document.documentElement.style.setProperty("--accent",hex);
    document.documentElement.style.setProperty("--accent-rgb",hexToRgb(hex));
    const isPreset=ACCENT_PRESETS.includes(hex);
    document.querySelectorAll(".swatch").forEach(s=>s.classList.toggle("active",s.dataset.hex===hex));
    // keep the picker synced to the current accent even when a preset was clicked, so it always
    // shows "what you'd start customizing from" - but only ring it as active when the color is
    // genuinely custom, otherwise it'd show two rings at once for preset colors. The native input's
    // own .value is kept in sync too (invisible, but it's still what the OS picker opens showing).
    customColorInput.value=hex;
    customSwatchFill.style.background=hex;
    customSwatchFill.classList.toggle("active",!isPreset);
    // never stomp the hex field while the user is actively typing in it - this fires mid-keystroke
    // (see hexInput's own "input" listener below) and reassigning .value there would reset their
    // cursor to the end on every character
    if(document.activeElement!==hexInput) hexInput.value=hex;
    hexInput.classList.remove("invalid");
    // the fill gradient is generated JS-side (see sliderGradient) rather than pure CSS, so it needs
    // an explicit re-render to pick up the new --accent instead of updating on its own
    if(!dragging) slider.style.background=sliderGradient(parseInt(volNum.textContent)||0,volNum.classList.contains("muted"));
  }
  document.querySelectorAll(".swatch").forEach(btn=>{
    btn.addEventListener("click",()=>{
      setAccent(btn.dataset.hex);
      localStorage.setItem(ACCENT_KEY,btn.dataset.hex);
    });
  });
  // "input" (not "change") fires continuously while the native picker is open, matching the
  // instant feedback a preset click gives instead of only updating after the picker is dismissed
  customColorInput.addEventListener("input",()=>{
    setAccent(customColorInput.value);
    localStorage.setItem(ACCENT_KEY,customColorInput.value);
  });
  // The one thing the swatches/native picker can't cover: Firefox on Android just opens a fixed
  // preset grid with no field to type a hex value at all, so this text input is the only place a
  // truly arbitrary color can be entered there. Applies live as soon as what's typed becomes a
  // valid hex color, rather than waiting for blur/Enter.
  hexInput.addEventListener("input",()=>{
    const v=normalizeHex(hexInput.value);
    if(HEX_RE.test(v)){
      setAccent(v);
      localStorage.setItem(ACCENT_KEY,v);
    } else {
      hexInput.classList.add("invalid");
    }
  });
  hexInput.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){ e.preventDefault(); hexInput.blur(); }
  });
  // Leaving the field on an incomplete/invalid value (e.g. "#5b8") snaps it back to whatever's
  // actually active, instead of leaving a dangling typo behind.
  hexInput.addEventListener("blur",()=>{
    hexInput.value=currentAccent;
    hexInput.classList.remove("invalid");
  });
  // Runs synchronously at script load (DOM already parsed, since this <script> is at the end of
  // <body>) so a saved accent applies before first paint - no flash of the default blue.
  (function loadAccent(){
    const saved=localStorage.getItem(ACCENT_KEY);
    setAccent(saved&&HEX_RE.test(saved)?saved:ACCENT_PRESETS[0]);
  })();

  let panelOpen=false;
  function togglePanel(){
    panelOpen=!panelOpen;
    settingsPanel.hidden=!panelOpen;
  }
  function closePanel(){
    panelOpen=false;
    settingsPanel.hidden=true;
  }
  settingsBtn.addEventListener("click",togglePanel);
  // settingsPanel is now the full-screen backdrop itself (see .settings-panel CSS) - only close
  // when the click lands on the backdrop directly, not when it bubbles up from .settings-box
  settingsPanel.addEventListener("click",(e)=>{
    if(e.target===settingsPanel) closePanel();
  });
  document.addEventListener("keydown",(e)=>{
    if(e.key==="Escape"&&panelOpen) closePanel();
  });

  fetchVolume();
  setInterval(fetchVolume,AUTO_REFRESH_MS);
</script>
</body>
</html>
