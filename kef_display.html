<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KEF LS50W (Display)</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KEF Volume">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    /* --bg is true black (not kef_volume.html's #0c0c0e) - on OLED that's the difference between
       a pixel actually switching off and one staying lit at low brightness, which is the whole
       point of this page. No scanline/texture overlay either, for the same reason - it would sit
       outside the fading #stage and stay visible even while "off". */
    --bg:#000000;--surface:#141417;--border:#2a2a30;--accent:#5b82e0;
    --text:#e8e4dc;--muted:#82838f;--red:#c0392b;--green:#2ecc71;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;
    overflow:hidden;position:fixed;inset:0;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}

  .stage{position:fixed;inset:0;opacity:1;z-index:1}
  .stage.fade-out{transition:opacity 1.5s ease-out}
  .stage.dimmed{opacity:0}

  .widget{position:absolute;display:flex;align-items:center;justify-content:center;touch-action:none}
  body.edit-mode .widget{outline:2px dashed var(--accent);outline-offset:4px;cursor:move}
  /* Percentage-based default geometry lives in CSS, not JS-computed pixels, so the very first
     render is always correct relative to whatever viewport size actually exists - no dependency
     on reading window.innerWidth/innerHeight at a moment that might race ahead of layout. JS only
     overwrites these with inline pixel styles once a saved layout is loaded or the user drags/resizes. */
  #widgetNumber{left:10%;top:15%;width:80%;height:45%}
  #widgetBar{left:10%;top:65%;width:80%;height:12%}

  /* No explicit width - as a flex item this shrinks to its content's true intrinsic size, which
     refreshNumberFont relies on to measure the actual rendered text dimensions (not an estimate). */
  .vol-display{font-family:'Bebas Neue',sans-serif;color:var(--accent);line-height:1;
    letter-spacing:-0.02em;transition:color 0.3s}
  .vol-display.muted{color:var(--muted)}
  .vol-display.stale{opacity:0.4}

  .bar-track{width:100%;height:100%;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;overflow:hidden;position:relative}
  .bar-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--accent);
    transition:width 0.3s ease,background 0.3s ease}
  .bar-fill.muted{background:var(--muted)}

  .resize-handle{position:absolute;right:-8px;bottom:-8px;width:30px;height:30px;
    background:var(--accent);border-radius:50%;display:none;cursor:nwse-resize;
    border:3px solid var(--bg);touch-action:none}
  body.edit-mode .resize-handle{display:block}

  .chrome{position:fixed;top:16px;right:16px;display:flex;align-items:center;gap:10px;z-index:5}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);
    transition:background 0.3s}
  .dot.online{background:var(--green);box-shadow:0 0 6px var(--green)}
  .dot.offline{background:var(--red);box-shadow:0 0 6px var(--red)}
  .dot.loading{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .chrome-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);
    width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:border-color 0.2s,color 0.2s}
  .chrome-btn:hover{border-color:var(--accent);color:var(--accent)}
  .chrome-btn[hidden]{display:none}
  /* svg is inline by default and carries a few px of baseline gap even inside a flex-centered
     parent - block display removes that so the icon actually lands in the button's true center. */
  .chrome-btn svg{display:block}

  .panel{position:fixed;top:66px;right:16px;z-index:6;background:var(--surface);
    border:1px solid var(--border);border-radius:6px;padding:20px 22px;width:min(300px,80vw)}
  .panel[hidden]{display:none}
  .panel-label{display:block;font-size:10px;letter-spacing:0.12em;color:var(--muted);margin-bottom:10px}
  .panel-row{margin-bottom:18px}
  .preset-group{display:flex;gap:6px}
  .preset-btn{flex:1;background:none;border:1px solid var(--border);color:var(--muted);
    font-family:'DM Mono',monospace;font-size:11px;padding:8px 0;border-radius:4px;cursor:pointer;
    transition:border-color 0.2s,color 0.2s}
  .preset-btn:hover{border-color:var(--accent);color:var(--accent)}
  .preset-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(91,130,224,0.12)}

  .safety-toggle{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:0.08em;
    color:var(--muted);margin-bottom:16px;cursor:pointer;user-select:none}
  .safety-toggle input[type=checkbox]{-webkit-appearance:none;appearance:none;position:relative;
    flex-shrink:0;width:14px;height:14px;border:1px solid var(--border);border-radius:3px;
    background:var(--bg);cursor:pointer;transition:border-color 0.2s,background 0.2s}
  .safety-toggle:hover input[type=checkbox]{border-color:var(--accent)}
  .safety-toggle input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
  .safety-toggle input[type=checkbox]:checked::after{content:'';position:absolute;
    left:4px;top:1px;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;
    transform:rotate(45deg)}

  .refresh-btn{background:none;border:1px solid var(--border);color:var(--muted);
    font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;padding:8px 14px;
    cursor:pointer;border-radius:4px;transition:border-color 0.2s,color 0.2s;width:100%}
  .refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

  .ios-hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:5;
    font-size:11px;letter-spacing:0.05em;color:var(--muted);background:var(--surface);
    border:1px solid var(--border);padding:8px 14px;border-radius:20px;white-space:nowrap}
  .ios-hint[hidden]{display:none}

  /* Kept at 1x1px and barely-above-zero opacity, never display:none/visibility:hidden - some
     browsers pause video playback on elements they consider fully hidden, which would defeat
     the whole point of this element (see the keepAwake script below and its comment on why the
     audio track has to stay unmuted). */
  #keepAwake{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0.01;pointer-events:none}

  /* Manual rotate is pure CSS, not the Orientation Lock API - many Android devices simply refuse
     to lock to reverse-portrait at all (silently coercing it back to normal portrait), so relying
     on the native API can't guarantee all 4 states on every device. Rotating our own rendered
     content sidesteps that entirely. Applying a transform here also makes this element the
     containing block for every position:fixed descendant (.stage/.chrome/.panel/.ios-hint), which
     is exactly what keeps all their existing viewport-relative CSS working unchanged post-rotation -
     they end up positioned relative to this (correctly sized/centered) box instead of the real,
     un-rotated viewport. */
  #rotateWrapper{position:fixed;top:0;left:0;width:100vw;height:100vh;transform-origin:center center}
  #rotateWrapper.rot-180{transform:rotate(180deg)}
  #rotateWrapper.rot-90,#rotateWrapper.rot-270{
    top:50%;left:50%;width:100vh;height:100vw;
  }
  #rotateWrapper.rot-90{transform:translate(-50%,-50%) rotate(90deg)}
  #rotateWrapper.rot-270{transform:translate(-50%,-50%) rotate(270deg)}
</style>
</head>

    <span>ALWAYS ON (DISABLE AUTO-DIM)</span>
  </label>
  <label class="safety-toggle" for="editModeCheckbox">
    <input type="checkbox" id="editModeCheckbox">
    <span>EDIT LAYOUT (DRAG / RESIZE)</span>
  </label>
  <button class="refresh-btn" id="resetLayoutBtn">↺ RESET LAYOUT</button>
</div>

<div class="ios-hint" id="iosHint" hidden>Tap Share → Add to Home Screen for fullscreen</div>

</div>

<script>
  // Page is served by the same Flask app it talks to, same as kef_volume.html - relative
  // paths work regardless of hostname/IP.
  const AUTO_REFRESH_MS = 3000;
  const SETTINGS_KEY = "kef_display_settings";
  const LAYOUT_KEY = "kef_display_layout";
  const MIN_WIDTH = 80;
  const MIN_HEIGHT = 60;
  const EDGE_MARGIN = 20; // a widget can never be dragged fully off-viewport - always this much stays reachable

  const keepAwakeVideo=document.getElementById("keepAwake");
  const rotateWrapper=document.getElementById("rotateWrapper");
  const stage=document.getElementById("stage");
  const volNum=document.getElementById("volNum");
  const barFill=document.getElementById("barFill");
  const widgetNumber=document.getElementById("widgetNumber");
  const widgetBar=document.getElementById("widgetBar");
  const handleNumber=document.getElementById("handleNumber");
  const handleBar=document.getElementById("handleBar");
  const dot=document.getElementById("dot");
  const fullscreenBtn=document.getElementById("fullscreenBtn");
  const rotateBtn=document.getElementById("rotateBtn");
  const settingsBtn=document.getElementById("settingsBtn");
  const settingsPanel=document.getElementById("settingsPanel");
  const alwaysOnCheckbox=document.getElementById("alwaysOnCheckbox");
  const editModeCheckbox=document.getElementById("editModeCheckbox");
  const resetLayoutBtn=document.getElementById("resetLayoutBtn");
  const iosHint=document.getElementById("iosHint");

  let settings={timeoutSeconds:2,alwaysOn:false}; // 2s default, like a normal TV's volume OSD
  // layoutHome is the one authoritative source of truth for the arrangement - {layout, canvasSize}
  // at whatever canvas size it was last explicitly committed for (edited, reset, or loaded). layout
  // is the currently DISPLAYED numbers: always freshly derived from layoutHome for the current
  // canvas (see reconcileLayoutToCurrentSize), except mid-drag/resize where it holds live values
  // that get committed back into layoutHome once the gesture ends.
  let layoutHome=null;
  let layout=null;
  let editMode=false;
  let panelOpen=false;
  let lastActivity=Date.now();
  let lastRenderedVolume=null;

  function widgetEl(key){return key==="number"?widgetNumber:widgetBar;}

  // Reads each widget's actual on-screen geometry (post-layout, via offsetLeft/Top/Width/Height -
  // valid here since .stage is their positioned ancestor and exactly fills the viewport). Used to
  // turn the CSS percentage-based bootstrap defaults into concrete pixel numbers, establishing the
  // very first layoutHome.
  function rectOf(el){
    return {x:el.offsetLeft,y:el.offsetTop,width:el.offsetWidth,height:el.offsetHeight};
  }
  function captureCurrentLayout(){
    return {number:rectOf(widgetNumber),bar:rectOf(widgetBar)};
  }
  // Defensive fallback only - by the time a user could actually start a drag, init (see below) has
  // long since established layoutHome. Cheap insurance against a pathological edge case (e.g. a
  // drag starting before the deferred init capture has run) rather than the primary path.
  function ensureLayout(){
    if(!layoutHome){
      layoutHome={layout:captureCurrentLayout(),canvasSize:{width:rotateWrapper.offsetWidth,height:rotateWrapper.offsetHeight}};
    }
    if(!layout) layout=JSON.parse(JSON.stringify(layoutHome.layout));
  }

  // Derives the DISPLAYED layout from the fixed layoutHome reference, scaled to fit the current
  // canvas - "scale the whole group to fit rotated/resized space". Deliberately always derives from
  // the SAME fixed layoutHome, never from whatever the previously-derived layout happened to be -
  // re-deriving from an already-derived result would compound shrinkage every time the canvas
  // alternates between two different aspect ratios (which every single rotation does), since
  // Math.min(a,b) picks the same tighter ratio regardless of which direction you're converting, so
  // a round trip through two shapes would shrink twice instead of once out and once back.
  // Uses ONE uniform scale factor (never independent per-axis factors, which would stretch each
  // widget into a different shape instead of shrinking/growing it intact), then centers the whole
  // scaled group within the new canvas - the same "fit and center" behavior as CSS object-fit:contain.
  function reconcileLayoutToCurrentSize(){
    if(!layoutHome) return; // init's deferred capture hasn't run yet - nothing to reconcile
    const curW=rotateWrapper.offsetWidth,curH=rotateWrapper.offsetHeight;
    const homeW=layoutHome.canvasSize.width,homeH=layoutHome.canvasSize.height;
    const scale=Math.min(curW/homeW,curH/homeH);
    const offsetX=(curW-homeW*scale)/2;
    const offsetY=(curH-homeH*scale)/2;
    layout={};
    ["number","bar"].forEach(key=>{
      const h=layoutHome.layout[key];
      layout[key]={x:h.x*scale+offsetX,y:h.y*scale+offsetY,width:h.width*scale,height:h.height*scale};
    });
    applyWidget("number");
    applyWidget("bar");
  }

  function refreshNumberFont(){
    // Measures the real rendered text at a trial size rather than guessing from constants (an
    // earlier version used fixed height/width ratios, which were too conservative and left the
    // digits visibly smaller than the box could actually fit). Font rendering scales linearly with
    // font-size, so one measurement is enough to solve exactly for the largest uniform size that
    // fits both the box's width and height - the trial size itself is arbitrary, it cancels out.
    const boxW=widgetNumber.offsetWidth,boxH=widgetNumber.offsetHeight;
    const trial=100;
    volNum.style.fontSize=trial+"px";
    const scale=Math.min(boxW/volNum.offsetWidth,boxH/volNum.offsetHeight);
    volNum.style.fontSize=Math.max(24,trial*scale)+"px";
  }

  function applyWidget(key){
    const el=widgetEl(key);
    const l=layout[key];
    el.style.left=l.x+"px";
    el.style.top=l.y+"px";
    el.style.width=l.width+"px";
    el.style.height=l.height+"px";
    if(key==="number") refreshNumberFont();
  }

  // Commits the currently displayed layout as the new authoritative home, at whatever canvas size
  // is currently in effect - whatever orientation you're editing in becomes the source of truth
  // that every other orientation is subsequently derived from.
  function commitLayoutAsHome(){
    layoutHome={layout:JSON.parse(JSON.stringify(layout)),canvasSize:{width:rotateWrapper.offsetWidth,height:rotateWrapper.offsetHeight}};
    saveLayoutHome();
  }

  function resetLayout(){
    // Reset still goes through the same layoutHome-plus-reconcile pipeline as everything else - not
    // a special "no layout" state - clear inline styles to reveal the CSS percentage bootstrap
    // defaults, capture that geometry fresh, then commit it as the new home.
    [widgetNumber,widgetBar].forEach(el=>{
      el.style.left="";el.style.top="";el.style.width="";el.style.height="";
    });
    layout=captureCurrentLayout();
    commitLayoutAsHome();
    applyWidget("number");
    applyWidget("bar");
  }

  function saveLayoutHome(){
    try{localStorage.setItem(LAYOUT_KEY,JSON.stringify(layoutHome));}catch(e){}
  }

  function loadLayoutHome(){
    try{
      const raw=localStorage.getItem(LAYOUT_KEY);
      if(raw){
        const parsed=JSON.parse(raw);
        if(parsed.layout&&parsed.canvasSize) return parsed;
      }
    }catch(e){}
    return null;
  }

  function saveSettings(){
    try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));}catch(e){}
  }

  function loadSettings(){
    try{
      const raw=localStorage.getItem(SETTINGS_KEY);
      if(raw){
        const parsed=JSON.parse(raw);
        if(typeof parsed.timeoutSeconds==="number") settings.timeoutSeconds=parsed.timeoutSeconds;
        settings.alwaysOn=!!parsed.alwaysOn;
      }
    }catch(e){}
  }

  function updatePresetActiveState(){
    document.querySelectorAll(".preset-btn").forEach(btn=>{
      btn.classList.toggle("active",parseInt(btn.dataset.secs)===settings.timeoutSeconds);
    });
  }

  // --- fade/dim state machine ---
  function wake(){
    lastActivity=Date.now();
    stage.classList.remove("fade-out");
    stage.classList.remove("dimmed");
  }

  function checkDim(){
    if(settings.alwaysOn||editMode||panelOpen) return;
    if(stage.classList.contains("dimmed")) return;
    if(Date.now()-lastActivity>settings.timeoutSeconds*1000){
      stage.classList.add("fade-out");
      requestAnimationFrame(()=>stage.classList.add("dimmed"));
    }
  }

  // Capture phase, ahead of any button's own click handler: while dimmed, the first tap anywhere
  // only wakes the display and is swallowed before it reaches whatever it landed on (e.g. the
  // settings gear) - otherwise a blind tap meant to wake the screen could also fire a hidden button.
  // ensureKeepAwakePlaying() is called directly here (not via a separate listener) because
  // stopPropagation() below would otherwise prevent it from ever running - the display sits dimmed
  // most of the time in real use, so a listener that only fires when propagation isn't stopped
  // would almost never get the user-gesture opportunity it needs to unblock the unmuted video.
  document.addEventListener("pointerdown",(e)=>{
    const wasDimmed=stage.classList.contains("dimmed");
    wake();
    ensureKeepAwakePlaying();
    if(wasDimmed) e.stopPropagation();
  },true);

  // --- volume display ---
  function setOnline(online){
    dot.className="dot "+(online?"online":"offline");
  }

  function updateDisplay(vol100,muted,stale){
    volNum.textContent=vol100;
    volNum.classList.toggle("muted",muted);
    volNum.classList.toggle("stale",stale);
    barFill.style.width=vol100+"%";
    barFill.classList.toggle("muted",muted);
    refreshNumberFont(); // digit count changes (e.g. 9 -> 10) shift the width-based cap in refreshNumberFont
  }

  async function fetchVolume(){
    try{
      const res=await fetch("/volume",{signal:AbortSignal.timeout(15000)});
      const data=await res.json();
      const vol100=Math.round(data.volume*100);
      if(lastRenderedVolume!==null&&vol100!==lastRenderedVolume) wake(); // a genuine volume change wakes the display too
      lastRenderedVolume=vol100;
      setOnline(data.online);
      updateDisplay(vol100,data.muted,!data.online);
    }catch(err){
      setOnline(false);
    }
  }

  // --- settings panel ---
  function togglePanel(){
    panelOpen=!panelOpen;
    settingsPanel.hidden=!panelOpen;
  }
  settingsBtn.addEventListener("click",togglePanel);

  document.querySelectorAll(".preset-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      settings.timeoutSeconds=parseInt(btn.dataset.secs);
      updatePresetActiveState();
      saveSettings();
    });
  });

  alwaysOnCheckbox.addEventListener("change",()=>{
    settings.alwaysOn=alwaysOnCheckbox.checked;
    if(settings.alwaysOn) wake();
    saveSettings();
  });

  editModeCheckbox.addEventListener("change",()=>{
    editMode=editModeCheckbox.checked;
    document.body.classList.toggle("edit-mode",editMode);
    if(editMode) wake();
  });

  resetLayoutBtn.addEventListener("click",resetLayout);

  // --- drag / resize (edit mode only) ---
  function clamp(val,size,viewportSize){
    const min=-(size-EDGE_MARGIN);
    const max=viewportSize-EDGE_MARGIN;
    return Math.min(max,Math.max(min,val));
  }

  function startDrag(e,key){
    if(!editMode) return;
    e.preventDefault();
    ensureLayout();
    const startX=e.clientX,startY=e.clientY;
    const orig={...layout[key]};
    function onMove(ev){
      const dx=ev.clientX-startX,dy=ev.clientY-startY;
      // Clamped against rotateWrapper's own rendered box, not window.innerWidth/innerHeight -
      // when rotated 90/270 that box is deliberately width/height-swapped from the raw viewport,
      // and widgets are positioned relative to it (see the #rotateWrapper CSS comment), not the
      // physical screen.
      layout[key].x=clamp(orig.x+dx,layout[key].width,rotateWrapper.offsetWidth);
      layout[key].y=clamp(orig.y+dy,layout[key].height,rotateWrapper.offsetHeight);
      applyWidget(key);
    }
    function onUp(){
      window.removeEventListener("pointermove",onMove);
      window.removeEventListener("pointerup",onUp);
      commitLayoutAsHome();
    }
    window.addEventListener("pointermove",onMove);
    window.addEventListener("pointerup",onUp);
  }

  function startResize(e,key){
    if(!editMode) return;
    e.preventDefault();
    ensureLayout();
    const startX=e.clientX,startY=e.clientY;
    const orig={...layout[key]};
    function onMove(ev){
      const dx=ev.clientX-startX,dy=ev.clientY-startY;
      layout[key].width=Math.max(MIN_WIDTH,orig.width+dx);
      layout[key].height=Math.max(MIN_HEIGHT,orig.height+dy);
      applyWidget(key);
    }
    function onUp(){
      window.removeEventListener("pointermove",onMove);
      window.removeEventListener("pointerup",onUp);
      commitLayoutAsHome();
    }
    window.addEventListener("pointermove",onMove);
    window.addEventListener("pointerup",onUp);
  }

  widgetNumber.addEventListener("pointerdown",(e)=>startDrag(e,"number"));
  widgetBar.addEventListener("pointerdown",(e)=>startDrag(e,"bar"));
  handleNumber.addEventListener("pointerdown",(e)=>{e.stopPropagation();startResize(e,"number");});
  handleBar.addEventListener("pointerdown",(e)=>{e.stopPropagation();startResize(e,"bar");});

  // --- keep-awake (looping video + audible track, muted at the OS media-volume level) ---
  // The Screen Wake Lock API is the "real" way to stop the OS from sleeping the display, but it
  // only works over HTTPS, which this app deliberately doesn't require (see the manifest/fullscreen
  // notes on portability). Empirically tested on real devices (both confirmed to fail otherwise):
  //   - Chrome for Android: no video-based trick works at all, muted or not - this exemption has
  //     been removed outright, not just tightened.
  //   - Firefox for Android: DOES still exempt a tab from screen sleep, but only while a video with
  //     a genuinely *unmuted* audio track is playing - a silent/muted video gets no exemption.
  // So this video is deliberately NOT muted (video.muted stays false, unlike a typical background
  // video) - that's what Firefox's heuristic actually keys off, confirmed by testing a muted visible
  // video side-by-side, which did nothing. The audio itself must be silenced at the phone's OS media
  // volume instead (a one-time manual step on the device, not something this page can control) -
  // Firefox only checks whether the tab is *producing* audio, not whether it's actually audible.
  // Net effect: this only works in Firefox, and only if the phone's media volume is turned all the
  // way down - if that volume is ever turned back up, this tone becomes audible.
  // Unmuted autoplay is blocked without a user gesture, so this typically won't start until the
  // first tap on the page (see the capture-phase pointerdown listener above, which calls this
  // directly) - after that it loops forever, so it only needs that one gesture. Also retried on
  // "click" specifically (not just pointerdown): some browsers only treat a completed press+release
  // as a strong enough gesture to unlock unmuted autoplay, so a bare pointerdown alone was taking
  // several taps before one of them happened to satisfy the browser's own heuristic.
  function ensureKeepAwakePlaying(){
    keepAwakeVideo.muted=false;
    keepAwakeVideo.play().catch(()=>{});
  }
  ensureKeepAwakePlaying();
  document.addEventListener("click",ensureKeepAwakePlaying);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden) ensureKeepAwakePlaying();});

  // --- manual rotate (pure CSS, not the Orientation Lock API) ---
  // Many Android devices simply refuse to lock to reverse-portrait, silently normalizing it back to
  // regular portrait regardless of what a page requests - confirmed on the actual target device,
  // where the native-API approach could reach landscape both ways but never true upside-down
  // portrait. Rotating our own rendered content instead guarantees all 4 states work on any device,
  // since it doesn't depend on the OS agreeing to anything.
  const ROTATE_KEY="kef_display_rotation";
  const ROTATIONS=[0,90,180,270];
  let rotationIndex=0;

  function applyRotation(){
    rotateWrapper.classList.remove("rot-90","rot-180","rot-270");
    const deg=ROTATIONS[rotationIndex];
    if(deg!==0) rotateWrapper.classList.add("rot-"+deg);
    // #rotateWrapper's own offsetWidth/offsetHeight swap under 90/270 (see its CSS) - reconcile
    // rescales the whole widget layout (position AND size, as a group) to fit that new space,
    // instead of just refreshing the numeral's font in isolation.
    reconcileLayoutToCurrentSize();
  }

  function loadRotation(){
    try{
      const raw=localStorage.getItem(ROTATE_KEY);
      const idx=raw===null?0:ROTATIONS.indexOf(parseInt(raw));
      rotationIndex=idx===-1?0:idx;
    }catch(e){}
    applyRotation();
  }

  function rotateUI(){
    rotationIndex=(rotationIndex+1)%ROTATIONS.length;
    applyRotation();
    try{localStorage.setItem(ROTATE_KEY,ROTATIONS[rotationIndex]);}catch(e){}
  }
  rotateBtn.addEventListener("click",rotateUI);

  // --- fullscreen (cross-platform) + matching the phone's actual physical orientation ---
  // Fullscreen itself doesn't dictate orientation, but browsers commonly apply their own default
  // (often landscape) unless the page explicitly locks orientation itself - screen.orientation.lock()
  // only works while the document is fullscreen (browsers restrict it to that, unrelated to any
  // choice of ours). This is separate from the manual rotate above: this only fights the browser's
  // own unwanted auto-rotate default, it never tries to reach a state the OS won't allow.
  const canLockOrientation=!!(screen.orientation&&screen.orientation.lock);

  function lockToOrientation(type){
    if(!canLockOrientation) return;
    screen.orientation.lock(type).catch(()=>{});
  }

  // Read BEFORE requesting fullscreen, not after - some browsers auto-rotate to landscape as part
  // of entering fullscreen itself, so screen.orientation.type may already reflect that unwanted
  // rotation by the time any post-request callback runs.
  let pendingOrientation=null;

  const canFullscreen=!!document.documentElement.requestFullscreen;
  if(canFullscreen){
    fullscreenBtn.addEventListener("click",()=>{
      if(document.fullscreenElement) document.exitFullscreen();
      else{
        pendingOrientation=screen.orientation.type;
        document.documentElement.requestFullscreen().catch(()=>{});
      }
    });
    const ENTER_ICON='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4"/><path d="M15 4h4a1 1 0 0 1 1 1v4"/><path d="M20 15v4a1 1 0 0 1-1 1h-4"/><path d="M9 20H5a1 1 0 0 1-1-1v-4"/></svg>';
    const EXIT_ICON='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4H5a1 1 0 0 0-1 1v4"/><path d="M20 9V5a1 1 0 0 0-1-1h-4"/><path d="M4 15v4a1 1 0 0 0 1 1h4"/><path d="M15 20h4a1 1 0 0 0 1-1v-4"/></svg>';
    document.addEventListener("fullscreenchange",()=>{
      const inFullscreen=!!document.fullscreenElement;
      fullscreenBtn.innerHTML=inFullscreen?EXIT_ICON:ENTER_ICON;
      rotateBtn.hidden=!inFullscreen;
      if(inFullscreen&&pendingOrientation){
        const target=pendingOrientation;
        pendingOrientation=null;
        // Locking immediately here was flashing landscape-then-back-to-portrait: the browser's own
        // auto-rotate sometimes happens slightly AFTER fullscreenchange fires, so an immediate lock
        // was getting overridden a moment later, then only corrected by (previously) a blind delay.
        // Instead, wait for the browser's own orientation "change" event (its unwanted auto-rotate,
        // if any) and correct right after THAT actually happens - if the browser never auto-rotates
        // at all, the timeout fallback still asserts the correct orientation regardless.
        let corrected=false;
        function onOrientationChange(){
          if(corrected) return;
          corrected=true;
          screen.orientation.removeEventListener("change",onOrientationChange);
          lockToOrientation(target);
        }
        if(canLockOrientation) screen.orientation.addEventListener("change",onOrientationChange);
        setTimeout(()=>{
          if(corrected) return;
          corrected=true;
          if(canLockOrientation) screen.orientation.removeEventListener("change",onOrientationChange);
          lockToOrientation(target);
        },400);
      }
    });
  }else{
    // iPhone Safari has never supported the Fullscreen API for ordinary elements (only iPad Safari
    // does) - the only real "fullscreen" there is launching from a Home Screen icon, which strips
    // Safari's chrome. navigator.standalone is iOS-specific and true once launched that way.
    fullscreenBtn.hidden=true;
    if(!window.navigator.standalone) iosHint.hidden=false;
  }

  // --- init ---
  loadSettings();
  updatePresetActiveState();
  alwaysOnCheckbox.checked=settings.alwaysOn;

  // Deferred one frame so the CSS percentage bootstrap has actually rendered before we read
  // geometry from it (offsetWidth/Height are 0 if read before the viewport is truly established -
  // see the note on rectOf/captureCurrentLayout). loadRotation (and the applyRotation ->
  // reconcileLayoutToCurrentSize chain it triggers) runs only after layoutHome exists, since that
  // chain now depends on it.
  requestAnimationFrame(()=>{
    layoutHome=loadLayoutHome()||{
      layout:captureCurrentLayout(),
      canvasSize:{width:rotateWrapper.offsetWidth,height:rotateWrapper.offsetHeight}
    };
    loadRotation(); // sets the rotation class, then reconciles layout to the current (possibly rotated) canvas size - covers "saved on a differently-sized screen" too
  });

  window.addEventListener("resize",reconcileLayoutToCurrentSize); // e.g. mobile browser chrome show/hide changing the available space

  fetchVolume();
  setInterval(fetchVolume,AUTO_REFRESH_MS);
  setInterval(checkDim,1000);
</script>
</body>
</html>
