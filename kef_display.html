<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KEF LS50W (Display)</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KEF Volume">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    /* --bg is true black (not kef_volume.html's #0c0c0e) - on OLED that's the difference between
       a pixel actually switching off and one staying lit at low brightness, which is the whole
       point of this page. No scanline/texture overlay either, for the same reason - it would sit
       outside the fading #stage and stay visible even while "off". */
    --bg:#000000;--surface:#141417;--border:#2a2a30;--accent:#5b82e0;--accent-rgb:91,130,224;
    --text:#e8e4dc;--muted:#82838f;--red:#c0392b;--green:#2ecc71;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;
    overflow:hidden;position:fixed;inset:0;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}

  .stage{position:fixed;inset:0;opacity:1;z-index:1}
  .stage.fade-out,.chromeRow.fade-out{transition:opacity 1.5s ease-out}
  .stage.dimmed,.chromeRow.dimmed{opacity:0}

  .widget{position:absolute;display:flex;align-items:center;justify-content:center;touch-action:none}
  body.edit-mode .widget{outline:2px dashed var(--accent);outline-offset:4px;cursor:move}
  /* Percentage-based default geometry lives in CSS, not JS-computed pixels, so the very first
     render is always correct relative to whatever viewport size actually exists - no dependency
     on reading window.innerWidth/innerHeight at a moment that might race ahead of layout. JS only
     overwrites these with inline pixel styles once a saved layout is loaded or the user drags/resizes. */
  #widgetNumber{left:10%;top:15%;width:80%;height:45%}
  #widgetBar{left:10%;top:65%;width:80%;height:12%}

  /* Rendered as SVG text, not an HTML div - refreshNumberFont() needs the numeral's true ink
     bounding box (getBBox()) to fit and center it tightly, and HTML has no reliable equivalent:
     a div's own box is the CSS line box (tied to line-height, not ink), and Range().getBoundingClientRect()
     - tried first - turned out to report something else entirely (a wide box's Range height came
     back at over 1.6x the box itself), not tight ink either. SVG getBBox() is the one measurement
     that's actually spec-defined as the tight geometric bounds of the rendered glyphs. */
  .vol-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .vol-display{font-family:'Bebas Neue',sans-serif;fill:var(--accent);
    letter-spacing:-0.02em;transition:fill 0.3s}
  .vol-display.muted{fill:var(--muted)}
  .vol-display.stale{opacity:0.4}

  /* border-radius here is a deliberately oversized px value, not 10px and not 50% - the browser
     clamps it down to exactly half of whichever side is shorter, which is what actually produces
     pill-shaped (semicircular) caps on a non-square box. 50% would instead resolve per-axis
     (half-width horizontally, half-height vertically) and draw an ellipse/lens shape instead of a
     pill - and since this track flips between wide-short and narrow-tall (see .vertical), a fixed
     small radius like the old 10px wouldn't read as a pill in either orientation anyway. */
  .bar-track{width:100%;height:100%;background:var(--surface);border:1px solid var(--border);
    border-radius:999px;overflow:hidden;position:relative}
  .bar-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--accent);
    transition:width 0.3s ease,background 0.3s ease}
  .bar-fill.muted{background:var(--muted)}
  /* Vertical mode fills bottom-to-top instead of left-to-right, like a level meter - top:auto
     un-pins the edge width/height animates from base's top:0/bottom:0, so only one axis is ever
     the animated one at a time (see updateDisplay(), which writes height instead of width here). */
  #widgetBar.vertical .bar-fill{left:0;right:0;top:auto;bottom:0;width:auto;height:0%;
    transition:height 0.3s ease,background 0.3s ease}

  /* Fixed corner badge, not inline with the numeral - refreshNumberFont() sizes the numeral to
     fill widgetNumber based on its own measured dimensions, so anything sharing that flex row
     would throw off the fit-to-box math. Sized in % so it scales with the widget's own edit-mode
     resize without any JS involvement. */
  .mute-icon{position:absolute;left:3%;bottom:6%;width:9%;height:auto;color:var(--muted);
    opacity:0;transition:opacity 0.3s;pointer-events:none}
  .mute-icon.visible{opacity:1}

  .resize-handle{position:absolute;right:-8px;bottom:-8px;width:30px;height:30px;
    background:var(--accent);border-radius:50%;display:none;cursor:nwse-resize;
    border:3px solid var(--bg);touch-action:none}
  body.edit-mode .resize-handle{display:block}

  /* Same accent-filled ring as .resize-handle so it reads as part of the same "edit-mode handle"
     family, opposite corner so it's never fought over with the resize handle, icon tinted with
     --bg for contrast against the fill. Only the bar widget gets one - orientation is meaningless
     for the numeral. */
  .orient-handle{position:absolute;left:-8px;top:-8px;width:30px;height:30px;
    background:var(--accent);border-radius:50%;display:none;cursor:pointer;
    border:3px solid var(--bg);touch-action:none;align-items:center;justify-content:center;
    color:var(--bg);padding:0}
  body.edit-mode .orient-handle{display:flex}
  .orient-handle svg{display:block}

  /* Opposite corner from .orient-handle, red instead of accent-filled - same "edit-mode handle"
     family but visually flagged as the one destructive action among them, since a mistap here
     (unlike drag/resize/rotate) can't be undone by just moving the pointer back. */
  .close-handle{position:absolute;right:-8px;top:-8px;width:30px;height:30px;
    background:var(--red);border-radius:50%;display:none;cursor:pointer;
    border:3px solid var(--bg);touch-action:none;align-items:center;justify-content:center;
    color:var(--bg);padding:0}
  body.edit-mode .close-handle{display:flex}
  .close-handle svg{display:block}

  /* widget-hidden marks a widget the user removed via .close-handle (currently only the bar
     supports this). Outside edit mode it's fully gone; inside edit mode it collapses to an empty
     ghost (still positioned/sized/draggable like any other widget, via the same .widget outline)
     with a restore affordance, so removing it can be undone in place without a full layout reset
     that would also discard any unrelated edits made to the numeral widget. */
  body:not(.edit-mode) .widget.widget-hidden{display:none}
  body.edit-mode .widget.widget-hidden .bar-track,
  body.edit-mode .widget.widget-hidden .orient-handle,
  body.edit-mode .widget.widget-hidden .resize-handle,
  body.edit-mode .widget.widget-hidden .close-handle{display:none}
  .restore-btn{display:none;background:rgba(var(--accent-rgb),0.12);border:1px solid var(--accent);
    color:var(--accent);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.08em;
    padding:8px 16px;border-radius:20px;cursor:pointer;white-space:nowrap}
  body.edit-mode .widget-hidden .restore-btn{display:block}

  .chromeRow{position:fixed;top:16px;right:16px;display:flex;align-items:center;gap:10px;z-index:5}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);
    transition:background 0.3s}
  .dot.online{background:var(--green);box-shadow:0 0 6px var(--green)}
  .dot.offline{background:var(--red);box-shadow:0 0 6px var(--red)}
  .dot.loading{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .chromeRow-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);
    width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:border-color 0.2s,color 0.2s}
  .chromeRow-btn:hover{border-color:var(--accent);color:var(--accent)}
  .chromeRow-btn[hidden]{display:none}
  /* svg is inline by default and carries a few px of baseline gap even inside a flex-centered
     parent - block display removes that so the icon actually lands in the button's true center. */
  .chromeRow-btn svg{display:block}

  /* Takes the chromeRow row's place while editing - same rgba accent tint as .preset-btn.active,
     so it reads as "the one thing you can do right now" rather than a generic button. */
  .apply-btn{background:rgba(var(--accent-rgb),0.12);border:1px solid var(--accent);color:var(--accent);
    font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;padding:0 16px;height:42px;
    border-radius:21px;cursor:pointer;white-space:nowrap;display:flex;align-items:center}
  .apply-btn[hidden]{display:none}

  .panel{position:fixed;top:66px;right:16px;z-index:6;background:var(--surface);
    border:1px solid var(--border);border-radius:6px;padding:20px 22px;width:min(300px,80vw)}
  .panel[hidden]{display:none}
  .panel-label{display:block;font-size:10px;letter-spacing:0.12em;color:var(--muted);margin-bottom:10px}
  .panel-row{margin-bottom:18px}
  .preset-group{display:flex;gap:6px}
  .preset-btn{flex:1;background:none;border:1px solid var(--border);color:var(--muted);
    font-family:'DM Mono',monospace;font-size:11px;padding:8px 0;border-radius:4px;cursor:pointer;
    transition:border-color 0.2s,color 0.2s}
  .preset-btn:hover{border-color:var(--accent);color:var(--accent)}
  .preset-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(var(--accent-rgb),0.12)}
  .preset-btn:disabled{opacity:0.35;cursor:not-allowed}
  .preset-btn:disabled:hover{border-color:var(--border);color:var(--muted)}

  /* Accent color picker - ported from kef_volume.html's settings panel, but this page keeps its
     own saved color (see ACCENT_KEY in the script below) rather than sharing kef_volume's, since
     the two displays are used independently and re-tinting one shouldn't silently re-tint the
     other. */
  .swatch-group{display:flex;gap:10px}
  .swatch{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;padding:0;
    box-shadow:0 0 0 2px transparent;transition:box-shadow 0.15s}
  .swatch:hover{box-shadow:0 0 0 2px var(--border)}
  .swatch.active{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}
  .custom-row{display:flex;align-items:center;gap:12px;margin-top:16px}
  .custom-swatch-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:5px;flex-shrink:0}
  .custom-swatch-box{position:relative;width:26px;height:26px}
  .custom-swatch-fill{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;
    box-shadow:0 0 0 2px transparent;transition:box-shadow 0.15s;pointer-events:none}
  .custom-swatch-box:hover .custom-swatch-fill{box-shadow:0 0 0 2px var(--border)}
  .custom-swatch-fill.active{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}
  .custom-swatch-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none}
  .custom-swatch-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;
    border:none;padding:0}
  .custom-swatch-label{font-size:8px;letter-spacing:0.1em;color:var(--muted)}
  .hex-input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);
    color:var(--text);font-family:'DM Mono',monospace;font-size:13px;letter-spacing:0.03em;
    padding:8px 10px;border-radius:4px}
  .hex-input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hex-input.invalid{border-color:var(--red);color:var(--red)}

  .safety-toggle{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:0.08em;
    color:var(--muted);margin-bottom:16px;cursor:pointer;user-select:none}
  .safety-toggle input[type=checkbox]{-webkit-appearance:none;appearance:none;position:relative;
    flex-shrink:0;width:14px;height:14px;border:1px solid var(--border);border-radius:3px;
    background:var(--bg);cursor:pointer;transition:border-color 0.2s,background 0.2s}
  .safety-toggle:hover input[type=checkbox]{border-color:var(--accent)}
  .safety-toggle input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
  .safety-toggle input[type=checkbox]:checked::after{content:'';position:absolute;
    left:4px;top:1px;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;
    transform:rotate(45deg)}

  .refresh-btn{background:none;border:1px solid var(--border);color:var(--muted);
    font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;padding:8px 14px;
    cursor:pointer;border-radius:4px;transition:border-color 0.2s,color 0.2s;width:100%}
  .refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

  .ios-hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:5;
    font-size:11px;letter-spacing:0.05em;color:var(--muted);background:var(--surface);
    border:1px solid var(--border);padding:8px 14px;border-radius:20px;white-space:nowrap}
  .ios-hint[hidden]{display:none}

  /* Kept at 1x1px and barely-above-zero opacity, never display:none/visibility:hidden - some
     browsers pause video playback on elements they consider fully hidden, which would defeat
     the whole point of this element (see the keepAwake script below and its comment on why the
     audio track has to stay unmuted). */
  #keepAwake{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0.01;pointer-events:none}

  /* Manual rotate is pure CSS, not the Orientation Lock API - many Android devices simply refuse
     to lock to reverse-portrait at all (silently coercing it back to normal portrait), so relying
     on the native API can't guarantee all 4 states on every device. Rotating our own rendered
     content sidesteps that entirely. Applying a transform here also makes this element the
     containing block for every position:fixed descendant (.stage/.chromeRow/.panel/.ios-hint), which
     is exactly what keeps all their existing viewport-relative CSS working unchanged post-rotation -
     they end up positioned relative to this (correctly sized/centered) box instead of the real,
     un-rotated viewport. */
  #rotateWrapper{position:fixed;top:0;left:0;width:100vw;height:100vh;transform-origin:center center}
  #rotateWrapper.rot-180{transform:rotate(180deg)}
  #rotateWrapper.rot-90,#rotateWrapper.rot-270{
    top:50%;left:50%;width:100vh;height:100vw;
  }
  #rotateWrapper.rot-90{transform:translate(-50%,-50%) rotate(90deg)}
  #rotateWrapper.rot-270{transform:translate(-50%,-50%) rotate(270deg)}
</style>
</head>

<script>
  // Page is served by the same Flask app it talks to, same as kef_volume.html - relative
  // paths work regardless of hostname/IP.
  const AUTO_REFRESH_MS = 3000;
  const SETTINGS_KEY = "kef_display_settings";
  const LAYOUT_KEY = "kef_display_layout";
  const MIN_WIDTH = 80;
  const MIN_HEIGHT = 60;
  const EDGE_MARGIN = 20; // a widget can never be dragged fully off-viewport - always this much stays reachable

  const keepAwakeVideo=document.getElementById("keepAwake");
  const rotateWrapper=document.getElementById("rotateWrapper");
  const stage=document.getElementById("stage");
  const chromeRow=document.getElementById("chromeRow");
  const volNum=document.getElementById("volNum");
  const muteIcon=document.getElementById("muteIcon");
  const barFill=document.getElementById("barFill");
  const widgetNumber=document.getElementById("widgetNumber");
  const widgetBar=document.getElementById("widgetBar");
  // Off-DOM canvas used purely for its 2D context's measureText() - the one API that reports a
  // font's true rendered ink extent (actualBoundingBox*) rather than a font-metrics box.
  const measureCtx=document.createElement("canvas").getContext("2d");
  const handleNumber=document.getElementById("handleNumber");
  const handleBar=document.getElementById("handleBar");
  const handleBarOrient=document.getElementById("handleBarOrient");
  const handleBarClose=document.getElementById("handleBarClose");
  const restoreBarBtn=document.getElementById("restoreBarBtn");
  const dot=document.getElementById("dot");
  const fullscreenBtn=document.getElementById("fullscreenBtn");
  const rotateBtn=document.getElementById("rotateBtn");
  const settingsBtn=document.getElementById("settingsBtn");
  const settingsPanel=document.getElementById("settingsPanel");
  const alwaysOnCheckbox=document.getElementById("alwaysOnCheckbox");
  const editLayoutBtn=document.getElementById("editLayoutBtn");
  const applyChangesBtn=document.getElementById("applyChangesBtn");
  const resetLayoutBtn=document.getElementById("resetLayoutBtn");
  const iosHint=document.getElementById("iosHint");

  let settings={timeoutSeconds:2,alwaysOn:false}; // 2s default, like a normal TV's volume OSD
  // layoutHome is the one authoritative source of truth for the arrangement - {layout, canvasSize}
  // at whatever canvas size it was last explicitly committed for (edited, reset, or loaded). layout
  // is the currently DISPLAYED numbers: always freshly derived from layoutHome for the current
  // canvas (see reconcileLayoutToCurrentSize), except mid-drag/resize where it holds live values
  // that get committed back into layoutHome once the gesture ends.
  let layoutHome=null;
  let layout=null;
  let editMode=false;
  let panelOpen=false;
  let lastActivity=Date.now();
  let lastRenderedVolume=null;
  let displayVersion=null; // mtime of this file on the server; a change means it was edited/deployed since we loaded

  function widgetEl(key){return key==="number"?widgetNumber:widgetBar;}

  // Reads each widget's actual on-screen geometry (post-layout, via offsetLeft/Top/Width/Height -
  // valid here since .stage is their positioned ancestor and exactly fills the viewport). Used to
  // turn the CSS percentage-based bootstrap defaults into concrete pixel numbers, establishing the
  // very first layoutHome.
  function rectOf(el){
    return {x:el.offsetLeft,y:el.offsetTop,width:el.offsetWidth,height:el.offsetHeight};
  }
  function captureCurrentLayout(){
    return {number:rectOf(widgetNumber),
      bar:{...rectOf(widgetBar),orientation:widgetBar.classList.contains("vertical")?"vertical":"horizontal",
        visible:!widgetBar.classList.contains("widget-hidden")}};
  }
  // Defensive fallback only - by the time a user could actually start a drag, init (see below) has
  // long since established layoutHome. Cheap insurance against a pathological edge case (e.g. a
  // drag starting before the deferred init capture has run) rather than the primary path.
  function ensureLayout(){
    if(!layoutHome){
      layoutHome={layout:captureCurrentLayout(),canvasSize:{width:rotateWrapper.offsetWidth,height:rotateWrapper.offsetHeight}};
    }
    if(!layout) layout=JSON.parse(JSON.stringify(layoutHome.layout));
  }

  // Derives the DISPLAYED layout from the fixed layoutHome reference, scaled to fit the current
  // canvas - "scale the whole group to fit rotated/resized space". Deliberately always derives from
  // the SAME fixed layoutHome, never from whatever the previously-derived layout happened to be -
  // re-deriving from an already-derived result would compound shrinkage every time the canvas
  // alternates between two different aspect ratios (which every single rotation does), since
  // Math.min(a,b) picks the same tighter ratio regardless of which direction you're converting, so
  // a round trip through two shapes would shrink twice instead of once out and once back.
  // Uses ONE uniform scale factor (never independent per-axis factors, which would stretch each
  // widget into a different shape instead of shrinking/growing it intact), then centers the whole
  // scaled group within the new canvas - the same "fit and center" behavior as CSS object-fit:contain.
  function reconcileLayoutToCurrentSize(){
    if(!layoutHome) return; // init's deferred capture hasn't run yet - nothing to reconcile
    const curW=rotateWrapper.offsetWidth,curH=rotateWrapper.offsetHeight;
    const homeW=layoutHome.canvasSize.width,homeH=layoutHome.canvasSize.height;
    const scale=Math.min(curW/homeW,curH/homeH);
    const offsetX=(curW-homeW*scale)/2;
    const offsetY=(curH-homeH*scale)/2;
    layout={};
    ["number","bar"].forEach(key=>{
      const h=layoutHome.layout[key];
      layout[key]={x:h.x*scale+offsetX,y:h.y*scale+offsetY,width:h.width*scale,height:h.height*scale,orientation:h.orientation,visible:h.visible};
    });
    applyWidget("number");
    applyWidget("bar");
    applyBarOrientation();
    applyBarVisibility();
  }

  function refreshNumberFont(){
    // Measures the real rendered text at a trial size rather than guessing from constants (an
    // earlier version used fixed height/width ratios, which were too conservative and left the
    // digits visibly smaller than the box could actually fit). Font rendering scales linearly with
    // font-size, so one measurement is enough to solve exactly for the largest uniform size that
    // fits both the box's width and height - the trial size itself is arbitrary, it cancels out.
    //
    // Measured via Canvas 2D's measureText(), not SVG getBBox() (an earlier version of this
    // function used getBBox(), on the assumption - stated in its own comment - that it returns the
    // tight ink bounds of the rendered glyphs. Live-tested in Chrome and confirmed false: it
    // returns a box based on the font's ascent/descent metrics, which for a font with any
    // descender glyphs is taller than digits (which have none) actually reach. Measured a live
    // 370.833px numeral where getBBox() reported height=445px exactly matching the widget box - a
    // seemingly tight fit - while the actual rendered ink, measured by rasterizing the same text/
    // font/size to a canvas and scanning for non-black pixels, was only 268px. That gap silently
    // shrunk the digits to ~60% of the box on every fit, growing in step with font-size, hence
    // worse-looking on larger boxes.) measureText()'s actualBoundingBox{Left,Right,Ascent,Descent}
    // are explicitly defined by spec as the true rendered ink extent relative to the text's
    // alignment point/baseline, and that alignment point is the same reference SVG <text> uses for
    // its own x/y (default text-anchor="start", alphabetic baseline) - so the offsets below can
    // position volNum directly via x/y with no separate bbox-then-translate step.
    const boxW=widgetNumber.offsetWidth,boxH=widgetNumber.offsetHeight;
    const trial=100;
    volNum.removeAttribute("transform");
    const cs=getComputedStyle(volNum);
    // letter-spacing is authored in em, so its resolved px value (read off cs) depends on whatever
    // font-size volNum actually has at the moment cs is read - getComputedStyle()'s return value is
    // live, but only correct if we set the font-size we're about to measure at FIRST. Setting the
    // trial size before reading cs.letterSpacing here (rather than after, as an earlier version of
    // this function did) is what makes that resolve correctly instead of carrying over whatever
    // font-size volNum was left at by the previous call - that staleness was scaling the trial
    // measurement's letter-spacing wrong, which skewed the width/height ratio just enough to
    // sometimes flip which axis got chosen as the binding constraint, letting digits overflow the
    // box on the other axis. Confirmed live in Chrome: instrumenting measureText showed the same
    // 400x528 box alternately resolving width-bound (correct) or height-bound (overflowing width)
    // purely depending on what the previous call had left volNum's rendered font-size at.
    volNum.style.fontSize=trial+"px";
    measureCtx.font=`${trial}px ${cs.fontFamily}`;
    if("letterSpacing" in measureCtx) measureCtx.letterSpacing=cs.letterSpacing;
    // Width comes from the actual displayed text - correctly reflects however many digits are
    // showing (e.g. "1" vs "88") and this font's letter-spacing.
    const displayedText=volNum.textContent;
    const wm=measureCtx.measureText(displayedText);
    const textW=wm.actualBoundingBoxLeft+wm.actualBoundingBoxRight;
    // Height, though, is measured against a fixed reference glyph ("0"), not whatever's actually
    // displayed - digits share the same cap-height in this font regardless of which ones show, and
    // the initial "--" placeholder has almost no vertical ink, which would blow the scale up to
    // something huge if used directly.
    const hm=measureCtx.measureText("0");
    const textH=hm.actualBoundingBoxAscent+hm.actualBoundingBoxDescent;
    const scale=Math.min(boxW/textW,boxH/textH);
    const fontSize=Math.max(24,trial*scale);
    volNum.style.fontSize=fontSize+"px";
    // Re-measure the displayed text at the real applied size (actualBoundingBox* scales linearly
    // with font-size just like the glyph outlines do, so re-measuring instead of rescaling the
    // trial-size numbers avoids compounding rounding) and center the ink itself in widgetNumber by
    // solving for the baseline position directly, rather than the box some model of the font claims.
    // letter-spacing is re-read off the same live `cs` object, now that volNum's font-size has
    // changed again - same reasoning as the trial-size read above.
    measureCtx.font=`${fontSize}px ${cs.fontFamily}`;
    if("letterSpacing" in measureCtx) measureCtx.letterSpacing=cs.letterSpacing;
    const m=measureCtx.measureText(displayedText);
    const x=(boxW-(m.actualBoundingBoxRight-m.actualBoundingBoxLeft))/2;
    const y=(boxH-(m.actualBoundingBoxDescent-m.actualBoundingBoxAscent))/2;
    volNum.setAttribute("x",x);
    volNum.setAttribute("y",y);
  }

  // Belt-and-suspenders on top of the explicit refreshNumberFont() calls scattered at every call
  // site that resizes widgetNumber (applyWidget, updateDisplay, the font-load handler below): this
  // watches the box's actual rendered size directly, so a fit can never go stale relative to
  // whatever's currently on screen - regardless of which JS path drove the resize, or whether some
  // future call site forgets to call refreshNumberFont() itself. Guards against re-entrant loops
  // (ResizeObserver firing from refreshNumberFont()'s own DOM writes) by only reacting when the box
  // size actually differs from the size the last fit was computed for.
  let lastFitSize="";
  new ResizeObserver(()=>{
    const size=widgetNumber.offsetWidth+"x"+widgetNumber.offsetHeight;
    if(size===lastFitSize) return;
    lastFitSize=size;
    refreshNumberFont();
  }).observe(widgetNumber);

  function applyWidget(key){
    const el=widgetEl(key);
    const l=layout[key];
    el.style.left=l.x+"px";
    el.style.top=l.y+"px";
    el.style.width=l.width+"px";
    el.style.height=l.height+"px";
    if(key==="number") refreshNumberFont();
  }

  // Toggles the volume bar between filling left-to-right and filling bottom-to-top (see the
  // #widgetBar.vertical CSS), so it can be resized tall-and-narrow and placed beside the numeral
  // instead of only ever spanning full-width beneath it.
  function applyBarOrientation(){
    // Reads whichever of width/height is currently the live one (rather than lastRenderedVolume,
    // which is still null until the first successful poll) so this works even before any real
    // volume has ever been fetched - carries the same fill % straight over to the other axis.
    const currentPct=parseFloat(barFill.style.width)||parseFloat(barFill.style.height)||0;
    const vertical=layout.bar.orientation==="vertical";
    widgetBar.classList.toggle("vertical",vertical);
    handleBarOrient.setAttribute("aria-label",vertical?"Rotate volume bar to horizontal":"Rotate volume bar to vertical");
    if(vertical){
      barFill.style.height=currentPct+"%";
      barFill.style.width="";
    } else {
      barFill.style.width=currentPct+"%";
      barFill.style.height="";
    }
  }

  // Shows/hides the bar widget per layout.bar.visible - see the .widget-hidden CSS for how this
  // reads differently in vs. out of edit mode (fully gone vs. a restorable ghost).
  function applyBarVisibility(){
    widgetBar.classList.toggle("widget-hidden",layout.bar.visible===false);
  }

  function hideBar(){
    ensureLayout();
    layout.bar.visible=false;
    applyBarVisibility();
    commitLayoutAsHome();
  }

  function showBar(){
    ensureLayout();
    layout.bar.visible=true;
    applyBarVisibility();
    commitLayoutAsHome();
  }

  // Actually spins the bounding box itself, not just the fill inside it - the box keeps the exact
  // same two edge lengths it already had (just transposed) and the same center point, the way
  // physically rotating a rectangle 90 degrees would, rather than leaving the box's shape alone and
  // only reinterpreting what's drawn inside it (which left a wide/short box looking broken until
  // the user separately dragged the resize handle to make it tall/narrow themselves).
  function toggleBarOrientation(){
    ensureLayout();
    const bar=layout.bar;
    bar.orientation=bar.orientation==="vertical"?"horizontal":"vertical";
    const cx=bar.x+bar.width/2,cy=bar.y+bar.height/2;
    const newWidth=bar.height,newHeight=bar.width;
    bar.width=newWidth;
    bar.height=newHeight;
    bar.x=clamp(cx-newWidth/2,newWidth,rotateWrapper.offsetWidth);
    bar.y=clamp(cy-newHeight/2,newHeight,rotateWrapper.offsetHeight);
    applyWidget("bar");
    applyBarOrientation();
    commitLayoutAsHome();
  }

  // Commits the currently displayed layout as the new authoritative home, at whatever canvas size
  // is currently in effect - whatever orientation you're editing in becomes the source of truth
  // that every other orientation is subsequently derived from.
  function commitLayoutAsHome(){
    layoutHome={layout:JSON.parse(JSON.stringify(layout)),canvasSize:{width:rotateWrapper.offsetWidth,height:rotateWrapper.offsetHeight}};
    saveLayoutHome();
  }

  function resetLayout(){
    // Reset still goes through the same layoutHome-plus-reconcile pipeline as everything else - not
    // a special "no layout" state - clear inline styles to reveal the CSS percentage bootstrap
    // defaults, capture that geometry fresh, then commit it as the new home.
    [widgetNumber,widgetBar].forEach(el=>{
      el.style.left="";el.style.top="";el.style.width="";el.style.height="";
    });
    widgetBar.classList.remove("vertical"); // must happen before captureCurrentLayout() reads it below
    widgetBar.classList.remove("widget-hidden");
    layout=captureCurrentLayout();
    commitLayoutAsHome();
    applyWidget("number");
    applyWidget("bar");
    applyBarOrientation();
    applyBarVisibility();
  }

  function saveLayoutHome(){
    try{localStorage.setItem(LAYOUT_KEY,JSON.stringify(layoutHome));}catch(e){}
  }

  function loadLayoutHome(){
    try{
      const raw=localStorage.getItem(LAYOUT_KEY);
      if(raw){
        const parsed=JSON.parse(raw);
        if(parsed.layout&&parsed.canvasSize) return parsed;
      }
    }catch(e){}
    return null;
  }

  function saveSettings(){
    try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));}catch(e){}
  }

  function loadSettings(){
    try{
      const raw=localStorage.getItem(SETTINGS_KEY);
      if(raw){
        const parsed=JSON.parse(raw);
        if(typeof parsed.timeoutSeconds==="number") settings.timeoutSeconds=parsed.timeoutSeconds;
        settings.alwaysOn=!!parsed.alwaysOn;
      }
    }catch(e){}
  }

  function updatePresetActiveState(){
    document.querySelectorAll(".preset-btn").forEach(btn=>{
      btn.classList.toggle("active",parseInt(btn.dataset.secs)===settings.timeoutSeconds);
      btn.disabled=settings.alwaysOn; // the timeout has no effect while auto-dim itself is disabled
    });
  }

  // --- fade/dim state machine ---
  // includeChrome=false wakes only the numbers/bar (.stage), leaving the chromeRow buttons dimmed -
  // used for the auto-refresh path below, where a server-side state change shouldn't itself reveal
  // the on-screen controls the way a real user touch does.
  function wake(includeChrome=true){
    lastActivity=Date.now();
    stage.classList.remove("fade-out");
    stage.classList.remove("dimmed");
    if(includeChrome){
      chromeRow.classList.remove("fade-out");
      chromeRow.classList.remove("dimmed");
    }
  }

  function checkDim(){
    if(settings.alwaysOn||editMode||panelOpen) return;
    if(stage.classList.contains("dimmed")) return;
    if(Date.now()-lastActivity>settings.timeoutSeconds*1000){
      stage.classList.add("fade-out");
      chromeRow.classList.add("fade-out");
      requestAnimationFrame(()=>{
        stage.classList.add("dimmed");
        chromeRow.classList.add("dimmed");
      });
    }
  }

  // Capture phase, ahead of any button's own click handler: while dimmed, the first tap anywhere
  // only wakes the display and is swallowed before it reaches whatever it landed on (e.g. the
  // settings gear) - otherwise a blind tap meant to wake the screen could also fire a hidden button.
  // ensureKeepAwakePlaying() is called directly here (not via a separate listener) because
  // stopPropagation() below would otherwise prevent it from ever running - the display sits dimmed
  // most of the time in real use, so a listener that only fires when propagation isn't stopped
  // would almost never get the user-gesture opportunity it needs to unblock the unmuted video.
  document.addEventListener("pointerdown",(e)=>{
    const wasDimmed=stage.classList.contains("dimmed");
    wake();
    ensureKeepAwakePlaying();
    if(wasDimmed) e.stopPropagation();
  },true);

  // --- volume display ---
  function setOnline(online){
    dot.className="dot "+(online?"online":"offline");
  }

  function updateDisplay(vol100,muted,stale){
    volNum.textContent=vol100;
    volNum.classList.toggle("muted",muted);
    volNum.classList.toggle("stale",stale);
    muteIcon.classList.toggle("visible",muted);
    if(widgetBar.classList.contains("vertical")){
      barFill.style.height=vol100+"%";
      barFill.style.width="";
    } else {
      barFill.style.width=vol100+"%";
      barFill.style.height="";
    }
    barFill.classList.toggle("muted",muted);
    refreshNumberFont(); // digit count changes (e.g. 9 -> 10) shift the width-based cap in refreshNumberFont
  }

  async function fetchVolume(){
    try{
      const res=await fetch("/volume",{signal:AbortSignal.timeout(15000)});
      const data=await res.json();
      const vol100=Math.round(data.volume*100);
      if(lastRenderedVolume!==null&&vol100!==lastRenderedVolume) wake(false); // a genuine volume change wakes the numbers/bar, not the chrome buttons
      lastRenderedVolume=vol100;
      setOnline(data.online);
      updateDisplay(vol100,data.muted,!data.online);
      if(data.display_version!=null){
        if(displayVersion!==null&&data.display_version!==displayVersion){ location.reload(); return; }
        displayVersion=data.display_version;
      }
    }catch(err){
      setOnline(false);
    }
  }

  // --- accent color --- (ported from kef_volume.html, but kept under its own key so the two
  // pages' accents can be set independently instead of one silently following the other)
  const ACCENT_KEY="kef_display_accent";
  const ACCENT_PRESETS=["#5b82e0","#4fc3a1","#9b6bdb","#e0a75b","#e05b6e","#4fb86a"];
  const HEX_RE=/^#[0-9a-f]{6}$/i;
  const customColorInput=document.getElementById("customColor");
  const customSwatchFill=document.getElementById("customSwatchFill");
  const hexInput=document.getElementById("hexInput");
  let currentAccent=ACCENT_PRESETS[0];

  function hexToRgb(hex){
    const n=parseInt(hex.slice(1),16);
    return `${(n>>16)&255},${(n>>8)&255},${n&255}`;
  }
  function normalizeHex(raw){
    let v=raw.trim().toLowerCase();
    if(!v.startsWith("#")) v="#"+v;
    if(/^#[0-9a-f]{3}$/.test(v)) v="#"+v.slice(1).split("").map(c=>c+c).join("");
    return v;
  }
  function setAccent(hex){
    hex=hex.toLowerCase();
    currentAccent=hex;
    document.documentElement.style.setProperty("--accent",hex);
    document.documentElement.style.setProperty("--accent-rgb",hexToRgb(hex));
    const isPreset=ACCENT_PRESETS.includes(hex);
    document.querySelectorAll(".swatch").forEach(s=>s.classList.toggle("active",s.dataset.hex===hex));
    customColorInput.value=hex;
    customSwatchFill.style.background=hex;
    customSwatchFill.classList.toggle("active",!isPreset);
    if(document.activeElement!==hexInput) hexInput.value=hex;
    hexInput.classList.remove("invalid");
  }
  document.querySelectorAll(".swatch").forEach(btn=>{
    btn.addEventListener("click",()=>{
      setAccent(btn.dataset.hex);
      localStorage.setItem(ACCENT_KEY,btn.dataset.hex);
    });
  });
  customColorInput.addEventListener("input",()=>{
    setAccent(customColorInput.value);
    localStorage.setItem(ACCENT_KEY,customColorInput.value);
  });
  hexInput.addEventListener("input",()=>{
    const v=normalizeHex(hexInput.value);
    if(HEX_RE.test(v)){
      setAccent(v);
      localStorage.setItem(ACCENT_KEY,v);
    } else {
      hexInput.classList.add("invalid");
    }
  });
  hexInput.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){ e.preventDefault(); hexInput.blur(); }
  });
  hexInput.addEventListener("blur",()=>{
    hexInput.value=currentAccent;
    hexInput.classList.remove("invalid");
  });
  (function loadAccent(){
    const saved=localStorage.getItem(ACCENT_KEY);
    setAccent(saved&&HEX_RE.test(saved)?saved:ACCENT_PRESETS[0]);
  })();

  // --- settings panel ---
  function togglePanel(){
    panelOpen=!panelOpen;
    settingsPanel.hidden=!panelOpen;
  }
  settingsBtn.addEventListener("click",togglePanel);

  // Closes the panel on any tap outside it - settingsBtn is excluded since its own click handler
  // above already owns opening/closing it; without that exclusion this would immediately re-close
  // whatever that handler just opened, as the same click bubbles up to document.
  document.addEventListener("click",(e)=>{
    if(!panelOpen) return;
    if(settingsPanel.contains(e.target)||settingsBtn.contains(e.target)||applyChangesBtn.contains(e.target)) return;
    togglePanel();
  });

  document.querySelectorAll(".preset-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      settings.timeoutSeconds=parseInt(btn.dataset.secs);
      updatePresetActiveState();
      saveSettings();
    });
  });

  alwaysOnCheckbox.addEventListener("change",()=>{
    settings.alwaysOn=alwaysOnCheckbox.checked;
    if(settings.alwaysOn) wake();
    saveSettings();
    updatePresetActiveState(); // re-evaluate the presets' disabled state
  });

  // Editing takes over the whole screen instead of living inside the settings panel - there's no
  // room to both see the full layout you're dragging/resizing AND keep the panel open, especially
  // on a phone. The panel closes and the chrome row's other buttons hide for the duration; a single
  // "Apply Changes" button takes their place and is the only way back, which also means there's no
  // separate "done editing" checkbox state to forget to uncheck.
  function enterEditMode(){
    editMode=true;
    document.body.classList.add("edit-mode");
    wake();
    panelOpen=false;
    settingsPanel.hidden=true;
    fullscreenBtn.hidden=true;
    rotateBtn.hidden=true;
    settingsBtn.hidden=true;
    applyChangesBtn.hidden=false;
  }

  function exitEditMode(){
    editMode=false;
    document.body.classList.remove("edit-mode");
    applyChangesBtn.hidden=true;
    settingsBtn.hidden=false;
    if(canFullscreen){
      fullscreenBtn.hidden=false;
      rotateBtn.hidden=!document.fullscreenElement;
    }
    panelOpen=true;
    settingsPanel.hidden=false;
  }

  editLayoutBtn.addEventListener("click",enterEditMode);
  applyChangesBtn.addEventListener("click",exitEditMode);

  resetLayoutBtn.addEventListener("click",resetLayout);

  // --- drag / resize (edit mode only) ---
  function clamp(val,size,viewportSize){
    const min=-(size-EDGE_MARGIN);
    const max=viewportSize-EDGE_MARGIN;
    return Math.min(max,Math.max(min,val));
  }

  function startDrag(e,key){
    if(!editMode) return;
    e.preventDefault();
    ensureLayout();
    const startX=e.clientX,startY=e.clientY;
    const orig={...layout[key]};
    function onMove(ev){
      const dx=ev.clientX-startX,dy=ev.clientY-startY;
      // Clamped against rotateWrapper's own rendered box, not window.innerWidth/innerHeight -
      // when rotated 90/270 that box is deliberately width/height-swapped from the raw viewport,
      // and widgets are positioned relative to it (see the #rotateWrapper CSS comment), not the
      // physical screen.
      layout[key].x=clamp(orig.x+dx,layout[key].width,rotateWrapper.offsetWidth);
      layout[key].y=clamp(orig.y+dy,layout[key].height,rotateWrapper.offsetHeight);
      applyWidget(key);
    }
    function onUp(){
      window.removeEventListener("pointermove",onMove);
      window.removeEventListener("pointerup",onUp);
      commitLayoutAsHome();
    }
    window.addEventListener("pointermove",onMove);
    window.addEventListener("pointerup",onUp);
  }

  function startResize(e,key){
    if(!editMode) return;
    e.preventDefault();
    ensureLayout();
    const startX=e.clientX,startY=e.clientY;
    const orig={...layout[key]};
    // For the bar, width/height swap which one is "thickness" vs "length" depending on
    // orientation (see toggleBarOrientation) - without this, the minimum thickness you could
    // resize down to would silently flip between MIN_WIDTH and MIN_HEIGHT depending on which way
    // the bar happened to be facing, instead of staying the same physical minimum either way.
    const vertical=key==="bar"&&layout.bar.orientation==="vertical";
    const minW=vertical?MIN_HEIGHT:MIN_WIDTH;
    const minH=vertical?MIN_WIDTH:MIN_HEIGHT;
    function onMove(ev){
      const dx=ev.clientX-startX,dy=ev.clientY-startY;
      layout[key].width=Math.max(minW,orig.width+dx);
      layout[key].height=Math.max(minH,orig.height+dy);
      applyWidget(key);
    }
    function onUp(){
      window.removeEventListener("pointermove",onMove);
      window.removeEventListener("pointerup",onUp);
      commitLayoutAsHome();
    }
    window.addEventListener("pointermove",onMove);
    window.addEventListener("pointerup",onUp);
  }

  widgetNumber.addEventListener("pointerdown",(e)=>startDrag(e,"number"));
  widgetBar.addEventListener("pointerdown",(e)=>startDrag(e,"bar"));
  handleNumber.addEventListener("pointerdown",(e)=>{e.stopPropagation();startResize(e,"number");});
  handleBar.addEventListener("pointerdown",(e)=>{e.stopPropagation();startResize(e,"bar");});
  // A tap, not a drag - stopPropagation still needed so it doesn't also reach widgetBar's own
  // pointerdown-drag listener above.
  handleBarOrient.addEventListener("pointerdown",(e)=>e.stopPropagation());
  handleBarOrient.addEventListener("click",toggleBarOrientation);
  handleBarClose.addEventListener("pointerdown",(e)=>e.stopPropagation());
  handleBarClose.addEventListener("click",hideBar);
  restoreBarBtn.addEventListener("pointerdown",(e)=>e.stopPropagation());
  restoreBarBtn.addEventListener("click",showBar);

  // --- keep-awake (looping video + audible track, muted at the OS media-volume level) ---
  // The Screen Wake Lock API is the "real" way to stop the OS from sleeping the display, but it
  // only works over HTTPS, which this app deliberately doesn't require (see the manifest/fullscreen
  // notes on portability). Empirically tested on real devices (both confirmed to fail otherwise):
  //   - Chrome for Android: no video-based trick works at all, muted or not - this exemption has
  //     been removed outright, not just tightened.
  //   - Firefox for Android: DOES still exempt a tab from screen sleep, but only while a video with
  //     a genuinely *unmuted* audio track is playing - a silent/muted video gets no exemption.
  // So this video is deliberately NOT muted (video.muted stays false, unlike a typical background
  // video) - that's what Firefox's heuristic actually keys off, confirmed by testing a muted visible
  // video side-by-side, which did nothing. The audio itself must be silenced at the phone's OS media
  // volume instead (a one-time manual step on the device, not something this page can control) -
  // Firefox only checks whether the tab is *producing* audio, not whether it's actually audible.
  // Net effect: this only works in Firefox, and only if the phone's media volume is turned all the
  // way down - if that volume is ever turned back up, this tone becomes audible.
  // Unmuted autoplay is blocked without a user gesture, so this typically won't start until the
  // first tap on the page (see the capture-phase pointerdown listener above, which calls this
  // directly) - after that it loops forever, so it only needs that one gesture. Also retried on
  // "click" specifically (not just pointerdown): some browsers only treat a completed press+release
  // as a strong enough gesture to unlock unmuted autoplay, so a bare pointerdown alone was taking
  // several taps before one of them happened to satisfy the browser's own heuristic.
  function ensureKeepAwakePlaying(){
    keepAwakeVideo.muted=false;
    keepAwakeVideo.play().catch(()=>{});
  }
  ensureKeepAwakePlaying();
  document.addEventListener("click",ensureKeepAwakePlaying);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden) ensureKeepAwakePlaying();});

  // --- manual rotate (pure CSS, not the Orientation Lock API) ---
  // Many Android devices simply refuse to lock to reverse-portrait, silently normalizing it back to
  // regular portrait regardless of what a page requests - confirmed on the actual target device,
  // where the native-API approach could reach landscape both ways but never true upside-down
  // portrait. Rotating our own rendered content instead guarantees all 4 states work on any device,
  // since it doesn't depend on the OS agreeing to anything.
  const ROTATE_KEY="kef_display_rotation";
  const ROTATIONS=[0,90,180,270];
  let rotationIndex=0;

  function applyRotation(){
    rotateWrapper.classList.remove("rot-90","rot-180","rot-270");
    const deg=ROTATIONS[rotationIndex];
    if(deg!==0) rotateWrapper.classList.add("rot-"+deg);
    // #rotateWrapper's own offsetWidth/offsetHeight swap under 90/270 (see its CSS) - reconcile
    // rescales the whole widget layout (position AND size, as a group) to fit that new space,
    // instead of just refreshing the numeral's font in isolation.
    reconcileLayoutToCurrentSize();
  }

  function loadRotation(){
    try{
      const raw=localStorage.getItem(ROTATE_KEY);
      const idx=raw===null?0:ROTATIONS.indexOf(parseInt(raw));
      rotationIndex=idx===-1?0:idx;
    }catch(e){}
    applyRotation();
  }

  function rotateUI(){
    rotationIndex=(rotationIndex+1)%ROTATIONS.length;
    applyRotation();
    try{localStorage.setItem(ROTATE_KEY,ROTATIONS[rotationIndex]);}catch(e){}
  }
  rotateBtn.addEventListener("click",rotateUI);

  // --- fullscreen (cross-platform) + matching the phone's actual physical orientation ---
  // Fullscreen itself doesn't dictate orientation, but browsers commonly apply their own default
  // (often landscape) unless the page explicitly locks orientation itself - screen.orientation.lock()
  // only works while the document is fullscreen (browsers restrict it to that, unrelated to any
  // choice of ours). This is separate from the manual rotate above: this only fights the browser's
  // own unwanted auto-rotate default, it never tries to reach a state the OS won't allow.
  const canLockOrientation=!!(screen.orientation&&screen.orientation.lock);

  function lockToOrientation(type){
    if(!canLockOrientation) return;
    screen.orientation.lock(type).catch(()=>{});
  }

  // Read BEFORE requesting fullscreen, not after - some browsers auto-rotate to landscape as part
  // of entering fullscreen itself, so screen.orientation.type may already reflect that unwanted
  // rotation by the time any post-request callback runs.
  let pendingOrientation=null;

  const canFullscreen=!!document.documentElement.requestFullscreen;
  if(canFullscreen){
    fullscreenBtn.addEventListener("click",()=>{
      if(document.fullscreenElement) document.exitFullscreen();
      else{
        pendingOrientation=screen.orientation.type;
        document.documentElement.requestFullscreen().catch(()=>{});
      }
    });
    const ENTER_ICON='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4"/><path d="M15 4h4a1 1 0 0 1 1 1v4"/><path d="M20 15v4a1 1 0 0 1-1 1h-4"/><path d="M9 20H5a1 1 0 0 1-1-1v-4"/></svg>';
    const EXIT_ICON='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4H5a1 1 0 0 0-1 1v4"/><path d="M20 9V5a1 1 0 0 0-1-1h-4"/><path d="M4 15v4a1 1 0 0 0 1 1h4"/><path d="M15 20h4a1 1 0 0 0 1-1v-4"/></svg>';
    document.addEventListener("fullscreenchange",()=>{
      const inFullscreen=!!document.fullscreenElement;
      fullscreenBtn.innerHTML=inFullscreen?EXIT_ICON:ENTER_ICON;
      rotateBtn.hidden=!inFullscreen;
      if(inFullscreen&&pendingOrientation){
        const target=pendingOrientation;
        pendingOrientation=null;
        // Locking immediately here was flashing landscape-then-back-to-portrait: the browser's own
        // auto-rotate sometimes happens slightly AFTER fullscreenchange fires, so an immediate lock
        // was getting overridden a moment later, then only corrected by (previously) a blind delay.
        // Instead, wait for the browser's own orientation "change" event (its unwanted auto-rotate,
        // if any) and correct right after THAT actually happens - if the browser never auto-rotates
        // at all, the timeout fallback still asserts the correct orientation regardless.
        let corrected=false;
        function onOrientationChange(){
          if(corrected) return;
          corrected=true;
          screen.orientation.removeEventListener("change",onOrientationChange);
          lockToOrientation(target);
        }
        if(canLockOrientation) screen.orientation.addEventListener("change",onOrientationChange);
        setTimeout(()=>{
          if(corrected) return;
          corrected=true;
          if(canLockOrientation) screen.orientation.removeEventListener("change",onOrientationChange);
          lockToOrientation(target);
        },400);
      }
    });
  }else{
    // iPhone Safari has never supported the Fullscreen API for ordinary elements (only iPad Safari
    // does) - the only real "fullscreen" there is launching from a Home Screen icon, which strips
    // Safari's chrome. navigator.standalone is iOS-specific and true once launched that way.
    fullscreenBtn.hidden=true;
    if(!window.navigator.standalone) iosHint.hidden=false;
  }

  // --- init ---
  loadSettings();
  updatePresetActiveState();
  alwaysOnCheckbox.checked=settings.alwaysOn;

  // Deferred one frame so the CSS percentage bootstrap has actually rendered before we read
  // geometry from it (offsetWidth/Height are 0 if read before the viewport is truly established -
  // see the note on rectOf/captureCurrentLayout). loadRotation (and the applyRotation ->
  // reconcileLayoutToCurrentSize chain it triggers) runs only after layoutHome exists, since that
  // chain now depends on it.
  requestAnimationFrame(()=>{
    layoutHome=loadLayoutHome()||{
      layout:captureCurrentLayout(),
      canvasSize:{width:rotateWrapper.offsetWidth,height:rotateWrapper.offsetHeight}
    };
    loadRotation(); // sets the rotation class, then reconciles layout to the current (possibly rotated) canvas size - covers "saved on a differently-sized screen" too
  });

  window.addEventListener("resize",reconcileLayoutToCurrentSize); // e.g. mobile browser chrome show/hide changing the available space

  // The Google Fonts stylesheet is loaded with display=swap, so on a real (non-cached) load the
  // browser paints with the fallback sans-serif FIRST and swaps to Bebas Neue only once it finishes
  // downloading. refreshNumberFont() runs well before that swap (right after layoutHome is
  // established above), so its font-size and centering transform get solved against the fallback
  // font's metrics - a completely different glyph shape/proportions - and nothing re-solves them
  // once Bebas Neue actually swaps in. That mismatch is exactly what showed up as digits sized and
  // positioned as if for a smaller, differently-shaped invisible box - it never used to reproduce in
  // repeat local testing simply because the font was already warm in cache by then. Re-running once
  // the real font is confirmed loaded/in-use corrects it regardless of load timing.
  if(document.fonts) document.fonts.ready.then(refreshNumberFont);

  fetchVolume();
  setInterval(fetchVolume,AUTO_REFRESH_MS);
  setInterval(checkDim,1000);
</script>
</body>
</html>
